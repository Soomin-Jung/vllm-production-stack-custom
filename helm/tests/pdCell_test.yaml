suite: test node-local P/D Cell rendering
templates:
  - configmap-pd-cell-gpu-launcher.yaml
  - configmap-pd-cell-guardian.yaml
  - deployment-pd-cell.yaml
  - service-pd-cell.yaml

set:
  servingEngineSpec:
    labels:
      environment: test
      release: test
    runtimeClassName: nvidia
    servicePort: 80
    startupProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      failureThreshold: 10
      httpGet:
        path: /health
    livenessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      failureThreshold: 3
      httpGet:
        path: /health
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 1
      failureThreshold: 3
      httpGet:
        path: /health

tests:
  - it: should always render vllm-router for P/D Cell and NIXL connector mapping
    set:
      pdCellSpec:
        enabled: true
        router:
          repository: registry.example/vllm-router
          tag: v0.1.15
          prometheusPort: 29000
        models:
          - name: pd-test
            servedModelNames:
              - pd-test-model
              - pd-test-alias
            repository: vllm/vllm-openai
            tag: test
            kvTransfer:
              connector: NixlConnector
              config:
                kv_buffer_device: cuda
                kv_load_failure_policy: fail
                kv_connector_extra_config:
                  backends: [UCX]
            prefill:
              count: 2
              requestGPU: 2
              portBase: 8101
              profile: /profiles/prefill.yaml
            decode:
              count: 2
              requestGPU: 2
              portBase: 8201
              profile: /profiles/decode.yaml
    asserts:
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.metadata.annotations.pd-orchestrator
          value: vllm-router
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.metadata.annotations.pd-kv-connector
          value: nixl
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[0].command[0]
          value: vllm-router
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --vllm-pd-disaggregation
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --kv-connector
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: nixl
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --health-check-interval-secs
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --health-check-timeout-secs
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 29000
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].args
          content: pd-test-alias
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].env
          content:
            name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: "5600"
      - template: service-pd-cell.yaml
        equal:
          path: spec.ports[0].targetPort
          value: pd-router

  - it: should render Mooncake pod-local GPU reservation and forced nvlink_intra for P1D2
    set:
      pdCellSpec:
        enabled: true
        router:
          repository: registry.example/vllm-router
          tag: v0.1.15
        models:
          - name: mooncake-p1d2
            repository: registry.example/vllm-openai
            tag: v0.26.0-cu129
            kvTransfer:
              connector: MooncakeConnector
              bootstrapPortBase: 9001
              abortRequestTimeout: 600
              config:
                kv_load_failure_policy: fail
                kv_connector_extra_config:
                  num_workers: 16
            prefill:
              count: 1
              requestGPU: 4
              portBase: 8101
              profile: /profiles/prefill-tp4.yaml
            decode:
              count: 2
              requestGPU: 2
              portBase: 8201
              profile: /profiles/decode-tp2.yaml
    asserts:
      - template: configmap-pd-cell-gpu-launcher.yaml
        isKind:
          of: ConfigMap
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.metadata.annotations.pd-kv-connector
          value: mooncake
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[0].name
          value: gpu-reservation
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
          value: "8"
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[1].name
          value: pd-router
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[1].command[0]
          value: vllm-router
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].args
          content: mooncake
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].args
          content: http://127.0.0.1:8101
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].args
          content: "9001"
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].args
          content: http://127.0.0.1:8201
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].args
          content: http://127.0.0.1:8202
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[1].startupProbe.failureThreshold
          value: 180
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[2].imagePullPolicy
          value: IfNotPresent
      - template: deployment-pd-cell.yaml
        notContains:
          path: spec.template.spec.containers[2].args
          content: --served-model-name
      - template: deployment-pd-cell.yaml
        notContains:
          path: spec.template.spec.containers[3].args
          content: --served-model-name
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[2].name
          value: prefill-0
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[2].command[1]
          value: /opt/pd-cell-gpu/launch-vllm.sh
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[2].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: all
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[2].env
          content:
            name: CNTR_GPU_IDX
            value: "0,1,2,3"
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[2].env
          content:
            name: VLLM_MOONCAKE_BOOTSTRAP_PORT
            value: "9001"
      - template: deployment-pd-cell.yaml
        notExists:
          path: spec.template.spec.containers[2].resources.requests["nvidia.com/gpu"]
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[3].name
          value: decode-0
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[3].env
          content:
            name: CNTR_GPU_IDX
            value: "4,5"
      - template: deployment-pd-cell.yaml
        notExists:
          path: spec.template.spec.containers[3].resources.requests["nvidia.com/gpu"]
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[4].name
          value: decode-1
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[4].env
          content:
            name: CNTR_GPU_IDX
            value: "6,7"
      - template: deployment-pd-cell.yaml
        notExists:
          path: spec.template.spec.containers[4].resources.requests["nvidia.com/gpu"]
      - template: configmap-pd-cell-guardian.yaml
        isKind:
          of: ConfigMap
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[5].name
          value: pd-cell-guardian
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[5].env
          content:
            name: NVIDIA_VISIBLE_DEVICES
            value: void
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[5].env
          content:
            name: PD_GUARDIAN_TARGETS
            value: pd-router,gpu-reservation,prefill-0,decode-0,decode-1

  - it: should propagate engine API key to vllm-router as OPENAI_API_KEY
    set:
      servingEngineSpec:
        vllmApiKey: test-api-key
      pdCellSpec:
        enabled: true
        router:
          repository: registry.example/vllm-router
          tag: v0.1.15
        models:
          - name: auth-test
            repository: vllm/vllm-openai
            tag: test
            kvTransfer:
              connector: MooncakeConnector
            prefill:
              count: 1
              requestGPU: 1
              profile: /profiles/p.yaml
            decode:
              count: 1
              requestGPU: 1
              profile: /profiles/d.yaml
    asserts:
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: vllmApiKey
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].env
          content:
            name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: vllmApiKey

  - it: should preserve container-specific env mounts and asymmetric GPUs
    set:
      global:
        env:
          - name: GLOBAL_ENV
            value: global
        extraVolumes:
          - name: global-volume
            emptyDir: {}
        extraVolumeMounts:
          - name: global-volume
            mountPath: /global
      pdCellSpec:
        enabled: true
        router:
          repository: registry.example/vllm-router
          tag: v0.1.15
          prometheusPort: 0
          env:
            - name: ROUTER_ENV
              value: router
        models:
          - name: asymmetric
            servedModelNames: [Qwen3.6-27B-PD, standard]
            repository: vllm/vllm-openai
            tag: test
            kvTransfer:
              connector: NixlConnector
            prefill:
              count: 1
              requestGPU: 4
              profile: /profiles/prefill-tp4.yaml
              env:
                - name: PREFILL_ENV
                  value: prefill
            decode:
              count: 2
              requestGPU: 2
              profile: /profiles/decode-tp2.yaml
              env:
                - name: DECODE_ENV
                  value: decode
    asserts:
      - template: deployment-pd-cell.yaml
        notExists:
          path: spec.template.spec.containers[0].ports[1]
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROUTER_ENV
            value: router
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[1].env
          content:
            name: PREFILL_ENV
            value: prefill
      - template: deployment-pd-cell.yaml
        contains:
          path: spec.template.spec.containers[2].env
          content:
            name: DECODE_ENV
            value: decode
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[1].resources.requests["nvidia.com/gpu"]
          value: "4"
      - template: deployment-pd-cell.yaml
        equal:
          path: spec.template.spec.containers[2].resources.requests["nvidia.com/gpu"]
          value: "2"

  - it: should not render P/D Cell resources when feature is disabled
    set:
      pdCellSpec:
        enabled: false
    asserts:
      - template: deployment-pd-cell.yaml
        hasDocuments:
          count: 0
      - template: service-pd-cell.yaml
        hasDocuments:
          count: 0
