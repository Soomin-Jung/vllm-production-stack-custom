apiVersion: v2
name: vllm-stack
description: The stack deployment of vLLM

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions to the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This chart version tracks the pinned upstream vLLM Production Stack baseline.
# Downstream customizations are tracked by Git commits and pull requests.
version: 0.1.8

maintainers:
  - name: apostac
