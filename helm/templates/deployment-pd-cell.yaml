              memory: {{ default "64Mi" $guardianRequests.memory | quote }}
            limits:
              cpu: {{ default "100m" $guardianLimits.cpu | quote }}
              memory: {{ default "128Mi" $guardianLimits.memory | quote }}
          volumeMounts:
            - name: pd-cell-guardian-script
              mountPath: /opt/pd-cell-guardian
              readOnly: true
            - name: pd-cell-guardian-token
              mountPath: /var/run/secrets/pd-cell-guardian
              readOnly: true
        {{- end }}

      {{- with $imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}

      volumes:
        - name: shm
          hostPath:
            path: /dev/shm
            type: Directory
        {{- if $guardianEnabled }}
        - name: pd-cell-guardian-script
          configMap:
            name: {{ $guardianName }}
            defaultMode: 0555
        - name: pd-cell-guardian-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        {{- if $isMooncakeConnector }}
        - name: pd-mooncake-gpu-map
          emptyDir: {}
        - name: pd-mooncake-gpu-launcher
          configMap:
            name: "{{ $root.Release.Name }}-pd-cell-gpu-launcher"
            defaultMode: 0555
        {{- end }}
        {{- with (values $podVolumeMap) }}
          {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- if or $root.Values.servingEngineSpec.tolerations $pdCellSpec.tolerations $modelSpec.tolerations }}
      tolerations:
        {{- with $root.Values.servingEngineSpec.tolerations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $pdCellSpec.tolerations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $modelSpec.tolerations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      {{- with $nodeName }}
      nodeName: {{ . }}
      {{- end }}

      {{- if not (empty $affinity) }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- else if and $nodeSelectorTerms (not $nodeName) }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              {{- toYaml $nodeSelectorTerms | nindent 14 }}
      {{- end }}
  {{ end }}
{{- end }}
