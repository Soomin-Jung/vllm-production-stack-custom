{{- $root := . -}}
{{- $pdCellSpec := $root.Values.pdCellSpec | default dict -}}
{{- if ($pdCellSpec.enabled | default false) -}}

  {{- $global := $root.Values.global | default dict -}}

  {{- $globalEnvMap := dict -}}
  {{- range $e := ($global.env | default (list)) -}}
    {{- $_ := set $globalEnvMap $e.name $e -}}
  {{- end -}}

  {{- $globalMountMap := dict -}}
  {{- range $e := ($global.extraVolumeMounts | default (list)) -}}
    {{- $_ := set $globalMountMap $e.name $e -}}
  {{- end -}}

  {{- $globalVolumeMap := dict -}}
  {{- range $e := ($global.extraVolumes | default (list)) -}}
    {{- $_ := set $globalVolumeMap $e.name $e -}}
  {{- end -}}

  {{- $commonEnvMap := deepCopy $globalEnvMap -}}
  {{- range $e := ($pdCellSpec.env | default (list)) -}}
    {{- $_ := set $commonEnvMap $e.name $e -}}
  {{- end -}}

  {{- $commonMountMap := deepCopy $globalMountMap -}}
  {{- range $e := ($pdCellSpec.extraVolumeMounts | default (list)) -}}
    {{- $_ := set $commonMountMap $e.name $e -}}
  {{- end -}}

  {{- $commonVolumeMap := deepCopy $globalVolumeMap -}}
  {{- range $e := ($pdCellSpec.extraVolumes | default (list)) -}}
    {{- $_ := set $commonVolumeMap $e.name $e -}}
  {{- end -}}

  {{- $seenNames := dict -}}

  {{ range $modelSpec := ($pdCellSpec.models | default (list)) }}
    {{ $name := required "pdCellSpec.models[].name is required" $modelSpec.name }}
    {{ if hasKey $seenNames $name }}
      {{ fail (printf "pdCellSpec.models[].name must be unique within one Helm release; duplicate: %s" $name) }}
    {{ end }}
    {{ $_ := set $seenNames $name true }}
    {{ $servedModelNames := list }}
    {{ $servedModelNamesRaw := $name }}
    {{ if hasKey $modelSpec "servedModelName" }}
      {{ $servedModelNamesRaw = $modelSpec.servedModelName }}
    {{ end }}
    {{ if hasKey $modelSpec "servedModelNames" }}
      {{ $servedModelNamesRaw = $modelSpec.servedModelNames }}
    {{ end }}
    {{ if kindIs "slice" $servedModelNamesRaw }}
      {{ range $servedName := $servedModelNamesRaw }}
        {{ if empty $servedName }}
          {{ fail (printf "pdCellSpec model %s: servedModelNames must not contain an empty name" $name) }}
        {{ end }}
        {{ $servedModelNames = append $servedModelNames (printf "%v" $servedName) }}
      {{ end }}
    {{ else }}
      {{ if empty $servedModelNamesRaw }}
        {{ fail (printf "pdCellSpec model %s: servedModelName must not be empty" $name) }}
      {{ end }}
      {{ $servedModelNames = append $servedModelNames (printf "%v" $servedModelNamesRaw) }}
    {{ end }}
    {{ if empty $servedModelNames }}
      {{ fail (printf "pdCellSpec model %s: at least one served model name is required" $name) }}
    {{ end }}
    {{ $servedModelNames = uniq $servedModelNames }}
    {{ $servedModelName := first $servedModelNames }}
    {{ $servedModelAliases := rest $servedModelNames }}
    {{ $repository := required (printf "pdCellSpec model %s: repository is required" $name) $modelSpec.repository }}
    {{ $tag := required (printf "pdCellSpec model %s: tag is required" $name) $modelSpec.tag }}
    {{ $replicaCount := 1 }}
    {{ if hasKey $modelSpec "replicaCount" }}
      {{ $replicaCount = int $modelSpec.replicaCount }}
    {{ end }}
    {{ if lt $replicaCount 0 }}
      {{ fail (printf "pdCellSpec model %s: replicaCount must be >= 0" $name) }}
    {{ end }}

    {{ $prefill := required (printf "pdCellSpec model %s: prefill is required" $name) $modelSpec.prefill }}
    {{ $decode := required (printf "pdCellSpec model %s: decode is required" $name) $modelSpec.decode }}
    {{ $pCount := int (required (printf "pdCellSpec model %s: prefill.count is required" $name) $prefill.count) }}
    {{ $dCount := int (required (printf "pdCellSpec model %s: decode.count is required" $name) $decode.count) }}
    {{ if lt $pCount 1 }}
      {{ fail (printf "pdCellSpec model %s: prefill.count must be >= 1" $name) }}
    {{ end }}
    {{ if lt $dCount 1 }}
      {{ fail (printf "pdCellSpec model %s: decode.count must be >= 1" $name) }}
    {{ end }}
    {{ $pProfile := required (printf "pdCellSpec model %s: prefill.profile is required" $name) $prefill.profile }}
    {{ $dProfile := required (printf "pdCellSpec model %s: decode.profile is required" $name) $decode.profile }}
    {{ $pPortBase := int (default 8101 $prefill.portBase) }}
    {{ $dPortBase := int (default 8201 $decode.portBase) }}
    {{ $pInternalPortBase := int (default 20000 $prefill.internalPortBase) }}
    {{ $dInternalPortBase := int (default 30000 $decode.internalPortBase) }}
    {{ $pDpMasterPortBase := int (default 24000 $prefill.dpMasterPortBase) }}
    {{ $dDpMasterPortBase := int (default 34000 $decode.dpMasterPortBase) }}
    {{ $pSideChannelPortBase := int (default 5600 $prefill.sideChannelPortBase) }}
    {{ $dSideChannelPortBase := int (default 5700 $decode.sideChannelPortBase) }}
    {{ $pInternalPortStride := int (default 100 $prefill.internalPortStride) }}
    {{ $dInternalPortStride := int (default 100 $decode.internalPortStride) }}
    {{ $pInternalPortMode := default "vllm" $prefill.internalPortMode }}
    {{ $dInternalPortMode := default "vllm" $decode.internalPortMode }}
    {{ if not (has $pInternalPortMode (list "vllm" "dp" "auto")) }}
      {{ fail (printf "pdCellSpec model %s: prefill.internalPortMode must be vllm, dp, or auto" $name) }}
    {{ end }}
    {{ if not (has $dInternalPortMode (list "vllm" "dp" "auto")) }}
      {{ fail (printf "pdCellSpec model %s: decode.internalPortMode must be vllm, dp, or auto" $name) }}
    {{ end }}

    {{ $commonRouter := $pdCellSpec.router | default dict }}
    {{ $modelRouter := $modelSpec.router | default dict }}
    {{ $router := mergeOverwrite (deepCopy $commonRouter) $modelRouter }}
    {{ $routerType := default "lmstack" $router.type }}
    {{ if not (has $routerType (list "lmstack" "vllm" "custom")) }}
      {{ fail (printf "pdCellSpec model %s: router.type must be lmstack, vllm, or custom" $name) }}
    {{ end }}
    {{ $routerRepository := default $root.Values.routerSpec.repository $router.repository }}
    {{ $routerRepository = required (printf "pdCellSpec model %s: router.repository is required" $name) $routerRepository }}
    {{ $routerTag := default $root.Values.routerSpec.tag $router.tag }}
    {{ $routerTag = required (printf "pdCellSpec model %s: router.tag is required; pin a validated router image" $name) $routerTag }}
    {{ $routerPort := int (default 8000 $router.port) }}
    {{ $routerHealthInterval := int (default 30 $router.healthCheckInterval) }}
    {{ $routerHealthTimeout := int (default 5 $router.healthCheckTimeout) }}
    {{ $routerImagePullPolicy := default "IfNotPresent" $root.Values.routerSpec.imagePullPolicy }}
    {{ $routerImagePullPolicy = default $routerImagePullPolicy $router.imagePullPolicy }}
    {{ $routerResources := mergeOverwrite (deepCopy ($root.Values.routerSpec.resources | default dict)) ($router.resources | default dict) }}
    {{ if empty $routerResources }}
      {{ $routerResources = dict "requests" (dict "cpu" "1000m" "memory" "5Gi") }}
    {{ end }}
    {{ $modelType := default "chat" $modelSpec.modelType }}
    {{ $routerHealthPath := default "/health" $router.healthPath }}
    {{ $routerPrometheusPort := 29000 }}
    {{ if hasKey $router "prometheusPort" }}
      {{ $routerPrometheusPort = int $router.prometheusPort }}
    {{ end }}
    {{ $routerPolicy := default "consistent_hash" $router.policy }}

    {{ $kv := deepCopy ($modelSpec.kvTransfer | default dict) }}
    {{ $kvConnector := required (printf "pdCellSpec model %s: models[].kvTransfer.connector is required" $name) $kv.connector }}
    {{ $kvBaseConfig := deepCopy ($kv.config | default dict) }}
    {{ $bootstrapPortBase := int (default 9001 $kv.bootstrapPortBase) }}
    {{ $abortTimeout := int (default 600 $kv.abortRequestTimeout) }}
    {{ $nixlSideChannelEnabled := has $kvConnector (list "NixlConnector" "NixlPullConnector" "NixlPushConnector") }}
    {{ if hasKey $kv "nixlSideChannelEnabled" }}
      {{ $nixlSideChannelEnabled = $kv.nixlSideChannelEnabled }}
    {{ end }}
    {{ $routerKvConnector := default "" $router.kvConnector }}
    {{ if empty $routerKvConnector }}
      {{ if contains "Mooncake" $kvConnector }}
        {{ $routerKvConnector = "mooncake" }}
      {{ else if contains "Nixl" $kvConnector }}
        {{ $routerKvConnector = "nixl" }}
      {{ end }}
    {{ end }}
    {{ if and (eq $routerType "vllm") (empty $routerKvConnector) }}
      {{ fail (printf "pdCellSpec model %s: router.kvConnector is required for vllm router with connector %s" $name $kvConnector) }}
    {{ end }}

    {{ $engineImagePullPolicy := default "Always" $root.Values.servingEngineSpec.imagePullPolicy }}
    {{ if hasKey $pdCellSpec "imagePullPolicy" }}
      {{ $engineImagePullPolicy = $pdCellSpec.imagePullPolicy }}
    {{ end }}
    {{ if hasKey $modelSpec "imagePullPolicy" }}
      {{ $engineImagePullPolicy = $modelSpec.imagePullPolicy }}
    {{ end }}

    {{ $runtimeClassName := default "" $root.Values.servingEngineSpec.runtimeClassName }}
    {{ if hasKey $pdCellSpec "runtimeClassName" }}
      {{ $runtimeClassName = $pdCellSpec.runtimeClassName }}
    {{ end }}
    {{ if hasKey $modelSpec "runtimeClassName" }}
      {{ $runtimeClassName = $modelSpec.runtimeClassName }}
    {{ end }}

    {{ $schedulerName := default "" $root.Values.servingEngineSpec.schedulerName }}
    {{ if hasKey $pdCellSpec "schedulerName" }}
      {{ $schedulerName = $pdCellSpec.schedulerName }}
    {{ end }}
    {{ if hasKey $modelSpec "schedulerName" }}
      {{ $schedulerName = $modelSpec.schedulerName }}
    {{ end }}

    {{ $nodeName := default "" $pdCellSpec.nodeName }}
    {{ if hasKey $modelSpec "nodeName" }}
      {{ $nodeName = $modelSpec.nodeName }}
    {{ end }}
    {{ $affinity := $pdCellSpec.affinity | default dict }}
    {{ if hasKey $modelSpec "affinity" }}
      {{ $affinity = $modelSpec.affinity }}
    {{ end }}
    {{ $nodeSelectorTerms := $pdCellSpec.nodeSelectorTerms | default (list) }}
    {{ if hasKey $modelSpec "nodeSelectorTerms" }}
      {{ $nodeSelectorTerms = $modelSpec.nodeSelectorTerms }}
    {{ end }}
    {{ $podAnnotations := mergeOverwrite (deepCopy ($pdCellSpec.podAnnotations | default dict)) ($modelSpec.podAnnotations | default dict) }}
    {{ $imagePullSecret := default "" $pdCellSpec.imagePullSecret }}
    {{ if hasKey $modelSpec "imagePullSecret" }}
      {{ $imagePullSecret = $modelSpec.imagePullSecret }}
    {{ end }}
    {{ $serviceAccountName := default "" $pdCellSpec.serviceAccountName }}
    {{ if hasKey $modelSpec "serviceAccountName" }}
      {{ $serviceAccountName = $modelSpec.serviceAccountName }}
    {{ end }}
    {{ $priorityClassName := default "" $pdCellSpec.priorityClassName }}
    {{ if hasKey $modelSpec "priorityClassName" }}
      {{ $priorityClassName = $modelSpec.priorityClassName }}
    {{ end }}
    {{ $strategy := $pdCellSpec.strategy | default dict }}
    {{ if hasKey $modelSpec "strategy" }}
      {{ $strategy = $modelSpec.strategy }}
    {{ end }}
    {{ $progressDeadlineSeconds := int (default 1800 $pdCellSpec.progressDeadlineSeconds) }}
    {{ if hasKey $modelSpec "progressDeadlineSeconds" }}
      {{ $progressDeadlineSeconds = int $modelSpec.progressDeadlineSeconds }}
    {{ end }}
    {{ $terminationGracePeriodSeconds := int (default 60 $pdCellSpec.terminationGracePeriodSeconds) }}
    {{ if hasKey $modelSpec "terminationGracePeriodSeconds" }}
      {{ $terminationGracePeriodSeconds = int $modelSpec.terminationGracePeriodSeconds }}
    {{ end }}

    {{ $prefillLabel := printf "%s-prefill" $name }}
    {{ $decodeLabel := printf "%s-decode" $name }}
    {{ $staticBackends := list }}
    {{ $staticModels := list }}
    {{ $staticLabels := list }}
    {{ $staticTypes := list }}
    {{ $staticAliases := list }}

    {{ range $alias := $servedModelAliases }}
      {{ $staticAliases = append $staticAliases (printf "%s:%s" $alias $servedModelName) }}
    {{ end }}

    {{ range $i := until $pCount }}
      {{ $staticBackends = append $staticBackends (printf "http://127.0.0.1:%d" (add $pPortBase $i)) }}
      {{ $staticModels = append $staticModels $servedModelName }}
      {{ $staticLabels = append $staticLabels $prefillLabel }}
      {{ $staticTypes = append $staticTypes $modelType }}
    {{ end }}

    {{ range $i := until $dCount }}
      {{ $staticBackends = append $staticBackends (printf "http://127.0.0.1:%d" (add $dPortBase $i)) }}
      {{ $staticModels = append $staticModels $servedModelName }}
      {{ $staticLabels = append $staticLabels $decodeLabel }}
      {{ $staticTypes = append $staticTypes $modelType }}
    {{ end }}

    {{ $modelEnvMap := deepCopy $commonEnvMap }}
    {{ range $e := ($modelSpec.env | default (list)) }}
      {{ $_ := set $modelEnvMap $e.name $e }}
    {{ end }}

    {{ $modelMountMap := deepCopy $commonMountMap }}
    {{ range $e := ($modelSpec.extraVolumeMounts | default (list)) }}
      {{ $_ := set $modelMountMap $e.name $e }}
    {{ end }}

    {{ $modelVolumeMap := deepCopy $commonVolumeMap }}
    {{ range $e := ($modelSpec.extraVolumes | default (list)) }}
      {{ $_ := set $modelVolumeMap $e.name $e }}
    {{ end }}

    {{ $routerEnvMap := deepCopy $modelEnvMap }}
    {{ range $e := ($commonRouter.env | default (list)) }}
      {{ $_ := set $routerEnvMap $e.name $e }}
    {{ end }}
    {{ range $e := ($modelRouter.env | default (list)) }}
      {{ $_ := set $routerEnvMap $e.name $e }}
    {{ end }}
    {{ if not (hasKey $routerEnvMap "PYTHONHASHSEED") }}
      {{ $_ := set $routerEnvMap "PYTHONHASHSEED" (dict "name" "PYTHONHASHSEED" "value" "123") }}
    {{ end }}

    {{ $routerMountMap := deepCopy $modelMountMap }}
    {{ range $e := ($commonRouter.extraVolumeMounts | default (list)) }}
      {{ $_ := set $routerMountMap $e.name $e }}
    {{ end }}
    {{ range $e := ($modelRouter.extraVolumeMounts | default (list)) }}
      {{ $_ := set $routerMountMap $e.name $e }}
    {{ end }}

    {{ $prefillMountMap := deepCopy $modelMountMap }}
    {{ range $e := ($prefill.extraVolumeMounts | default (list)) }}
      {{ $_ := set $prefillMountMap $e.name $e }}
    {{ end }}

    {{ $decodeMountMap := deepCopy $modelMountMap }}
    {{ range $e := ($decode.extraVolumeMounts | default (list)) }}
      {{ $_ := set $decodeMountMap $e.name $e }}
    {{ end }}

    {{ $podVolumeMap := deepCopy $modelVolumeMap }}
    {{ range $e := ($commonRouter.extraVolumes | default (list)) }}
      {{ $_ := set $podVolumeMap $e.name $e }}
    {{ end }}
    {{ range $e := ($modelRouter.extraVolumes | default (list)) }}
      {{ $_ := set $podVolumeMap $e.name $e }}
    {{ end }}
    {{ range $e := ($prefill.extraVolumes | default (list)) }}
      {{ $_ := set $podVolumeMap $e.name $e }}
    {{ end }}
    {{ range $e := ($decode.extraVolumes | default (list)) }}
      {{ $_ := set $podVolumeMap $e.name $e }}
    {{ end }}

    {{ $podSecurityContext := mergeOverwrite (deepCopy ($root.Values.servingEngineSpec.securityContext | default dict)) ($pdCellSpec.securityContext | default dict) }}
    {{ $podSecurityContext = mergeOverwrite $podSecurityContext ($modelSpec.securityContext | default dict) }}
    {{ $engineSecurityContext := mergeOverwrite (deepCopy ($root.Values.servingEngineSpec.containerSecurityContext | default dict)) ($pdCellSpec.containerSecurityContext | default dict) }}
    {{ $engineSecurityContext = mergeOverwrite $engineSecurityContext ($modelSpec.containerSecurityContext | default dict) }}
    {{ $routerSecurityContext := mergeOverwrite (deepCopy ($root.Values.routerSpec.containerSecurityContext | default dict)) ($router.containerSecurityContext | default dict) }}
    {{ $prefillSecurityContext := mergeOverwrite (deepCopy $engineSecurityContext) ($prefill.containerSecurityContext | default dict) }}
    {{ $decodeSecurityContext := mergeOverwrite (deepCopy $engineSecurityContext) ($decode.containerSecurityContext | default dict) }}

    {{ $commonEnvFrom := list }}
    {{ range $e := ($global.envFrom | default (list)) }}
      {{ $commonEnvFrom = append $commonEnvFrom $e }}
    {{ end }}
    {{ range $e := ($pdCellSpec.envFrom | default (list)) }}
      {{ $commonEnvFrom = append $commonEnvFrom $e }}
    {{ end }}
    {{ $modelEnvFrom := deepCopy $commonEnvFrom }}
    {{ range $e := ($modelSpec.envFrom | default (list)) }}
      {{ $modelEnvFrom = append $modelEnvFrom $e }}
    {{ end }}
    {{ if $modelSpec.envFromSecret }}
      {{ $modelEnvFrom = append $modelEnvFrom (dict "secretRef" (dict "name" $modelSpec.envFromSecret.name)) }}
    {{ end }}
    {{ $routerEnvFrom := deepCopy $modelEnvFrom }}
    {{ range $e := ($commonRouter.envFrom | default (list)) }}
      {{ $routerEnvFrom = append $routerEnvFrom $e }}
    {{ end }}
    {{ range $e := ($modelRouter.envFrom | default (list)) }}
      {{ $routerEnvFrom = append $routerEnvFrom $e }}
    {{ end }}
    {{ $routerExtraArgs := list }}
    {{ range $arg := ($commonRouter.extraArgs | default (list)) }}
      {{ $routerExtraArgs = append $routerExtraArgs $arg }}
    {{ end }}
    {{ range $arg := ($modelRouter.extraArgs | default (list)) }}
      {{ $routerExtraArgs = append $routerExtraArgs $arg }}
    {{ end }}
    {{ $prefillEnvFrom := deepCopy $modelEnvFrom }}
    {{ range $e := ($prefill.envFrom | default (list)) }}
      {{ $prefillEnvFrom = append $prefillEnvFrom $e }}
    {{ end }}
    {{ $decodeEnvFrom := deepCopy $modelEnvFrom }}
    {{ range $e := ($decode.envFrom | default (list)) }}
      {{ $decodeEnvFrom = append $decodeEnvFrom $e }}
    {{ end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $root.Release.Name }}-{{ $name }}-pd-cell"
  namespace: {{ $root.Release.Namespace }}
  labels:
    model: {{ $name | quote }}
    helm-release-name: {{ $root.Release.Name | quote }}
    pd-cell: "true"
    pd-deployment: {{ $name | quote }}
    {{- include "chart.engineLabels" $root | nindent 4 }}
spec:
  replicas: {{ $replicaCount }}
  strategy:
    {{- if $strategy }}
      {{- toYaml $strategy | nindent 4 }}
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    {{- end }}
  selector:
    matchLabels:
      model: {{ $name | quote }}
      helm-release-name: {{ $root.Release.Name | quote }}
      pd-cell: "true"
  progressDeadlineSeconds: {{ $progressDeadlineSeconds }}
  template:
    metadata:
      labels:
        model: {{ $name | quote }}
        helm-release-name: {{ $root.Release.Name | quote }}
        pd-cell: "true"
        pd-deployment: {{ $name | quote }}
        {{- include "chart.engineLabels" $root | nindent 8 }}
      annotations:
        pd-served-model: {{ $servedModelName | quote }}
        pd-served-models: {{ toJson $servedModelNames | quote }}
        {{- with $podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if $serviceAccountName }}
      serviceAccountName: {{ $serviceAccountName }}
      {{- end }}

      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName | quote }}
      {{- end }}

      {{- with $runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}

      {{- with $schedulerName }}
      schedulerName: {{ . }}
      {{- end }}

      terminationGracePeriodSeconds: {{ $terminationGracePeriodSeconds }}

      containers:
        - name: pd-router
          image: "{{ $routerRepository }}:{{ $routerTag }}"
          imagePullPolicy: {{ $routerImagePullPolicy | quote }}
          {{- with $router.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- if hasKey $router "args" }}
              {{- toYaml $router.args | nindent 12 }}
            {{- else if eq $routerType "lmstack" }}
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ $routerPort | quote }}
            - "--service-discovery"
            - "static"
            - "--static-backends"
            - {{ join "," $staticBackends | quote }}
            - "--static-models"
            - {{ join "," $staticModels | quote }}
            {{- if $staticAliases }}
            - "--static-aliases"
            - {{ join "," $staticAliases | quote }}
            {{- end }}
            - "--static-model-labels"
            - {{ join "," $staticLabels | quote }}
            - "--static-model-types"
            - {{ join "," $staticTypes | quote }}
            - "--static-backend-health-checks"
            - "--static-backend-health-check-interval"
            - {{ $routerHealthInterval | quote }}
            - "--static-backend-health-check-timeout-seconds"
            - {{ $routerHealthTimeout | quote }}
            - "--routing-logic"
            - "disaggregated_prefill_orchestrated"
            - "--prefill-model-labels"
            - {{ $prefillLabel | quote }}
            - "--decode-model-labels"
            - {{ $decodeLabel | quote }}
            {{- else if eq $routerType "vllm" }}
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ $routerPort | quote }}
            - "--policy"
            - {{ $routerPolicy | quote }}
            - "--vllm-pd-disaggregation"
            - "--kv-connector"
            - {{ $routerKvConnector | quote }}
            {{- range $i := until $pCount }}
            - "--prefill"
            - {{ printf "http://127.0.0.1:%d" (add $pPortBase $i) | quote }}
              {{- if eq $routerKvConnector "mooncake" }}
            - {{ printf "%d" (add $bootstrapPortBase $i) | quote }}
              {{- end }}
            {{- end }}
            {{- range $i := until $dCount }}
            - "--decode"
            - {{ printf "http://127.0.0.1:%d" (add $dPortBase $i) | quote }}
            {{- end }}
            {{- if gt $routerPrometheusPort 0 }}
            - "--prometheus-host"
            - "0.0.0.0"
            - "--prometheus-port"
            - {{ $routerPrometheusPort | quote }}
            {{- end }}
            {{- else }}
              {{- fail (printf "pdCellSpec model %s: router.args is required when router.type=custom" $name) }}
            {{- end }}
            {{- range $routerExtraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- with (values $routerEnvMap) }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- $vllmApiKey := $root.Values.servingEngineSpec.vllmApiKey }}
            {{- if $vllmApiKey }}
            - name: VLLM_API_KEY
              {{- if kindIs "string" $vllmApiKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-secrets
                  key: vllmApiKey
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $vllmApiKey.secretName }}
                  key: {{ $vllmApiKey.secretKey }}
              {{- end }}
            {{- end }}
          {{- with $routerEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: pd-router
              containerPort: {{ $routerPort }}
              protocol: TCP
            {{- if and (eq $routerType "vllm") (gt $routerPrometheusPort 0) }}
            - name: router-metrics
              containerPort: {{ $routerPrometheusPort }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ $routerHealthPath }}
              port: {{ $routerPort }}
            initialDelaySeconds: {{ default 5 $router.startupProbeInitialDelaySeconds }}
            periodSeconds: {{ default 5 $router.startupProbePeriodSeconds }}
            failureThreshold: {{ default 60 $router.startupProbeFailureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $routerHealthPath }}
              port: {{ $routerPort }}
            periodSeconds: {{ default 10 $router.livenessProbePeriodSeconds }}
            failureThreshold: {{ default 3 $router.livenessProbeFailureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $routerHealthPath }}
              port: {{ $routerPort }}
            periodSeconds: {{ default 5 $router.readinessProbePeriodSeconds }}
            failureThreshold: {{ default 3 $router.readinessProbeFailureThreshold }}
          resources:
            {{- toYaml $routerResources | nindent 12 }}
          {{- with $routerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (values $routerMountMap) }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        {{ range $i := until $pCount }}
          {{ $enginePort := add $pPortBase $i }}
          {{ $bootstrapPort := add $bootstrapPortBase $i }}
          {{ $internalPort := add $pInternalPortBase (mul $pInternalPortStride $i) }}
          {{ $dpMasterPort := add $pDpMasterPortBase $i }}
          {{ $sideChannelPort := add $pSideChannelPortBase $i }}
          {{ $phaseEnvMap := deepCopy $modelEnvMap }}

          {{ range $e := ($prefill.env | default (list)) }}
            {{ $_ := set $phaseEnvMap $e.name $e }}
          {{ end }}

          {{ if eq $pInternalPortMode "vllm" }}
            {{ $_ := set $phaseEnvMap "VLLM_PORT" (dict "name" "VLLM_PORT" "value" (printf "%d" $internalPort)) }}
          {{ else if eq $pInternalPortMode "dp" }}
            {{ $_ := set $phaseEnvMap "VLLM_DP_MASTER_PORT" (dict "name" "VLLM_DP_MASTER_PORT" "value" (printf "%d" $dpMasterPort)) }}
          {{ end }}
          {{ if $nixlSideChannelEnabled }}
            {{ $_ := set $phaseEnvMap "VLLM_NIXL_SIDE_CHANNEL_PORT" (dict "name" "VLLM_NIXL_SIDE_CHANNEL_PORT" "value" (printf "%d" $sideChannelPort)) }}
          {{ end }}
          {{ if eq $kvConnector "MooncakeConnector" }}
            {{ $_ := set $phaseEnvMap "VLLM_MOONCAKE_BOOTSTRAP_PORT" (dict "name" "VLLM_MOONCAKE_BOOTSTRAP_PORT" "value" (printf "%d" $bootstrapPort)) }}
            {{ $_ := set $phaseEnvMap "VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT" (dict "name" "VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT" "value" (printf "%d" $abortTimeout)) }}
          {{ end }}
          {{ $_ := set $phaseEnvMap "PROMETHEUS_MULTIPROC_DIR" (dict "name" "PROMETHEUS_MULTIPROC_DIR" "value" "/tmp") }}
          {{ $kvConfig := mergeOverwrite (deepCopy $kvBaseConfig) ($kv.prefillConfig | default dict) }}
          {{ $kvConfig = mergeOverwrite $kvConfig ($prefill.kvTransferConfig | default dict) }}
          {{ $_ := set $kvConfig "kv_connector" $kvConnector }}
          {{ $_ := set $kvConfig "kv_role" "kv_producer" }}
        - name: {{ printf "prefill-%d" $i }}
          image: "{{ $repository }}:{{ $tag }}"
          imagePullPolicy: {{ $engineImagePullPolicy | quote }}
          command:
            {{- if $prefill.command }}
              {{- toYaml $prefill.command | nindent 12 }}
            {{- else }}
            - {{ ternary "/opt/venv/bin/vllm" "vllm" (eq $repository "lmcache/vllm-openai") | quote }}
            - "serve"
            {{- end }}
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ $enginePort | quote }}
            - "--config"
            - {{ $pProfile | quote }}
            - "--served-model-name"
            {{- range $servedName := $servedModelNames }}
            - {{ $servedName | quote }}
            {{- end }}
            - "--kv-transfer-config"
            - {{ toJson $kvConfig | quote }}
            {{- range ($prefill.extraArgs | default (list)) }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with (values $phaseEnvMap) }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- $vllmApiKey := $root.Values.servingEngineSpec.vllmApiKey }}
            {{- if $vllmApiKey }}
            - name: VLLM_API_KEY
              {{- if kindIs "string" $vllmApiKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-secrets
                  key: vllmApiKey
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $vllmApiKey.secretName }}
                  key: {{ $vllmApiKey.secretKey }}
              {{- end }}
            {{- end }}
          {{- with $prefillEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ printf "pf-%d-http" $i }}
              containerPort: {{ $enginePort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ default "/health" $root.Values.servingEngineSpec.startupProbe.httpGet.path }}
              port: {{ $enginePort }}
            initialDelaySeconds: {{ default 15 $root.Values.servingEngineSpec.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ default 10 $root.Values.servingEngineSpec.startupProbe.periodSeconds }}
            failureThreshold: {{ default 360 $root.Values.servingEngineSpec.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ default "/health" $root.Values.servingEngineSpec.livenessProbe.httpGet.path }}
              port: {{ $enginePort }}
            initialDelaySeconds: {{ default 15 $root.Values.servingEngineSpec.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ default 10 $root.Values.servingEngineSpec.livenessProbe.periodSeconds }}
            failureThreshold: {{ default 3 $root.Values.servingEngineSpec.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ default "/health" $root.Values.servingEngineSpec.readinessProbe.httpGet.path }}
              port: {{ $enginePort }}
            initialDelaySeconds: {{ default 15 $root.Values.servingEngineSpec.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ default 5 $root.Values.servingEngineSpec.readinessProbe.periodSeconds }}
            failureThreshold: {{ default 3 $root.Values.servingEngineSpec.readinessProbe.failureThreshold }}
          resources: {{- include "chart.resources" $prefill | nindent 12 }}
          {{- with $prefillSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            {{- with (values $prefillMountMap) }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        {{ end }}

        {{ range $i := until $dCount }}
          {{ $enginePort := add $dPortBase $i }}
          {{ $internalPort := add $dInternalPortBase (mul $dInternalPortStride $i) }}
          {{ $dpMasterPort := add $dDpMasterPortBase $i }}
          {{ $sideChannelPort := add $dSideChannelPortBase $i }}
          {{ $phaseEnvMap := deepCopy $modelEnvMap }}

          {{ range $e := ($decode.env | default (list)) }}
            {{ $_ := set $phaseEnvMap $e.name $e }}
          {{ end }}

          {{ if eq $dInternalPortMode "vllm" }}
            {{ $_ := set $phaseEnvMap "VLLM_PORT" (dict "name" "VLLM_PORT" "value" (printf "%d" $internalPort)) }}
          {{ else if eq $dInternalPortMode "dp" }}
            {{ $_ := set $phaseEnvMap "VLLM_DP_MASTER_PORT" (dict "name" "VLLM_DP_MASTER_PORT" "value" (printf "%d" $dpMasterPort)) }}
          {{ end }}
          {{ if $nixlSideChannelEnabled }}
            {{ $_ := set $phaseEnvMap "VLLM_NIXL_SIDE_CHANNEL_PORT" (dict "name" "VLLM_NIXL_SIDE_CHANNEL_PORT" "value" (printf "%d" $sideChannelPort)) }}
          {{ end }}
          {{ if eq $kvConnector "MooncakeConnector" }}
            {{ $_ := set $phaseEnvMap "VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT" (dict "name" "VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT" "value" (printf "%d" $abortTimeout)) }}
          {{ end }}
          {{ $_ := set $phaseEnvMap "PROMETHEUS_MULTIPROC_DIR" (dict "name" "PROMETHEUS_MULTIPROC_DIR" "value" "/tmp") }}
          {{ $kvConfig := mergeOverwrite (deepCopy $kvBaseConfig) ($kv.decodeConfig | default dict) }}
          {{ $kvConfig = mergeOverwrite $kvConfig ($decode.kvTransferConfig | default dict) }}
          {{ $_ := set $kvConfig "kv_connector" $kvConnector }}
          {{ $_ := set $kvConfig "kv_role" "kv_consumer" }}
        - name: {{ printf "decode-%d" $i }}
          image: "{{ $repository }}:{{ $tag }}"
          imagePullPolicy: {{ $engineImagePullPolicy | quote }}
          command:
            {{- if $decode.command }}
              {{- toYaml $decode.command | nindent 12 }}
            {{- else }}
            - {{ ternary "/opt/venv/bin/vllm" "vllm" (eq $repository "lmcache/vllm-openai") | quote }}
            - "serve"
            {{- end }}
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ $enginePort | quote }}
            - "--config"
            - {{ $dProfile | quote }}
            - "--served-model-name"
            {{- range $servedName := $servedModelNames }}
            - {{ $servedName | quote }}
            {{- end }}
            - "--kv-transfer-config"
            - {{ toJson $kvConfig | quote }}
            {{- range ($decode.extraArgs | default (list)) }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with (values $phaseEnvMap) }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- $vllmApiKey := $root.Values.servingEngineSpec.vllmApiKey }}
            {{- if $vllmApiKey }}
            - name: VLLM_API_KEY
              {{- if kindIs "string" $vllmApiKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-secrets
                  key: vllmApiKey
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $vllmApiKey.secretName }}
                  key: {{ $vllmApiKey.secretKey }}
              {{- end }}
            {{- end }}
          {{- with $decodeEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ printf "dc-%d-http" $i }}
              containerPort: {{ $enginePort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ default "/health" $root.Values.servingEngineSpec.startupProbe.httpGet.path }}
              port: {{ $enginePort }}
            initialDelaySeconds: {{ default 15 $root.Values.servingEngineSpec.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ default 10 $root.Values.servingEngineSpec.startupProbe.periodSeconds }}
            failureThreshold: {{ default 360 $root.Values.servingEngineSpec.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ default "/health" $root.Values.servingEngineSpec.livenessProbe.httpGet.path }}
              port: {{ $enginePort }}
            initialDelaySeconds: {{ default 15 $root.Values.servingEngineSpec.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ default 10 $root.Values.servingEngineSpec.livenessProbe.periodSeconds }}
            failureThreshold: {{ default 3 $root.Values.servingEngineSpec.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ default "/health" $root.Values.servingEngineSpec.readinessProbe.httpGet.path }}
              port: {{ $enginePort }}
            initialDelaySeconds: {{ default 15 $root.Values.servingEngineSpec.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ default 5 $root.Values.servingEngineSpec.readinessProbe.periodSeconds }}
            failureThreshold: {{ default 3 $root.Values.servingEngineSpec.readinessProbe.failureThreshold }}
          resources: {{- include "chart.resources" $decode | nindent 12 }}
          {{- with $decodeSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            {{- with (values $decodeMountMap) }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        {{ end }}

      {{- with $imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}

      volumes:
        - name: shm
          hostPath:
            path: /dev/shm
            type: Directory
        {{- with (values $podVolumeMap) }}
          {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- if or $root.Values.servingEngineSpec.tolerations $pdCellSpec.tolerations $modelSpec.tolerations }}
      tolerations:
        {{- with $root.Values.servingEngineSpec.tolerations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $pdCellSpec.tolerations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $modelSpec.tolerations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      {{- with $nodeName }}
      nodeName: {{ . }}
      {{- end }}

      {{- if not (empty $affinity) }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- else if and $nodeSelectorTerms (not $nodeName) }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              {{- toYaml $nodeSelectorTerms | nindent 14 }}
      {{- end }}
  {{ end }}
{{- end }}
