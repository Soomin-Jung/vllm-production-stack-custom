            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            {{- if $isMooncakeConnector }}
            - name: pd-mooncake-gpu-map
              mountPath: /var/run/pd-gpu
              readOnly: true
            - name: pd-mooncake-gpu-launcher
              mountPath: /opt/pd-cell-gpu
              readOnly: true
            {{- end }}
            {{- with (values $decodeMountMap) }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        {{ end }}

        {{- if $guardianEnabled }}
        - name: pd-cell-guardian
          image: "{{ $repository }}:{{ $tag }}"
          imagePullPolicy: {{ $engineImagePullPolicy | quote }}
          command:
            - "python3"
            - "/opt/pd-cell-guardian/guardian.py"
          env:
