{{- $pdCellSpec := .Values.pdCellSpec | default dict -}}
{{- if ($pdCellSpec.enabled | default false) -}}
  {{- range $modelSpec := ($pdCellSpec.models | default (list)) }}
    {{- $name := required "pdCellSpec.models[].name is required" $modelSpec.name -}}
    {{- $router := mergeOverwrite (deepCopy ($pdCellSpec.router | default dict)) ($modelSpec.router | default dict) -}}
    {{- $routerPort := int (default 8000 $router.port) -}}
    {{- $serviceType := default "ClusterIP" $pdCellSpec.serviceType -}}
    {{- if hasKey $modelSpec "serviceType" -}}
      {{- $serviceType = $modelSpec.serviceType -}}
    {{- end -}}
    {{- $servicePort := default $routerPort $.Values.servingEngineSpec.servicePort -}}
    {{- if hasKey $pdCellSpec "servicePort" -}}
      {{- $servicePort = $pdCellSpec.servicePort -}}
    {{- end -}}
    {{- if hasKey $modelSpec "servicePort" -}}
      {{- $servicePort = $modelSpec.servicePort -}}
    {{- end -}}
    {{- $serviceAnnotations := mergeOverwrite (deepCopy ($pdCellSpec.serviceAnnotations | default dict)) ($modelSpec.serviceAnnotations | default dict) -}}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ $.Release.Name }}-{{ $name }}-pd-engine-service"
  namespace: {{ $.Release.Namespace }}
  labels:
    pd-cell: "true"
    pd-deployment: {{ $name | quote }}
    {{- include "chart.engineLabels" $ | nindent 4 }}
  {{- with $serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $serviceType }}
  ports:
    - name: pd-router
      port: {{ $servicePort }}
      targetPort: pd-router
      protocol: TCP
  selector:
    model: {{ $name | quote }}
    helm-release-name: {{ $.Release.Name | quote }}
    pd-cell: "true"
    pd-deployment: {{ $name | quote }}
{{ end }}
{{- end }}
