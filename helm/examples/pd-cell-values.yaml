# Minimal P/D Cell values for custom vLLM Production Stack 0.1.8.
#
# Global traffic routing may continue to use LMStack Router. The router inside
# every P/D Cell is intentionally fixed to vllm-project/router because the
# orchestrator must understand the selected KV connector contract.

pdCellSpec:
  enabled: true

  router:
    repository: vllm/vllm-router
    tag: v0.1.15
    port: 8000
    policy: consistent_hash
    prometheusPort: 29000

  models:
    - name: example-pd-p1d1
      servedModelNames:
        - example-model
        - example-alias
      repository: vllm/vllm-openai
      tag: v0.26.0-cu129
      replicaCount: 1

      # The chart injects kv_producer / kv_consumer automatically and derives
      # vllm-router --kv-connector=mooncake from this connector.
      kvTransfer:
        connector: MooncakeConnector
        bootstrapPortBase: 9001
        abortRequestTimeout: 600
        config:
          kv_load_failure_policy: fail
          kv_connector_extra_config:
            mooncake_protocol: nvlink_intra

      prefill:
        count: 1
        requestGPU: 4
        profile: /profiles/example/pd-prefill.yaml

      decode:
        count: 1
        requestGPU: 4
        profile: /profiles/example/pd-decode.yaml

      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.product
              operator: In
              values:
                - NVIDIA-H200
