# Minimal P/D Cell values for custom vLLM Production Stack 0.1.8.
#
# Inherited defaults are intentionally omitted. See PD_CELL_0.1.8_KO.md for
# shared scheduling overrides and the complete KVTransferConfig guide.

pdCellSpec:
  enabled: true

  # Shared by every models[] item unless overridden at model level.
  router:
    repository: registry.example/lmstack-router
    tag: validated-0.1.12

  # The chart injects kv_producer/kv_consumer automatically.
  kvTransfer:
    connector: NixlConnector

  models:
    - name: example-pd-p2d2
      servedModelName: example-model
      repository: vllm/vllm-openai
      tag: v0.27.1-cu129
      replicaCount: 1

      prefill:
        count: 2
        requestGPU: 2
        profile: /profiles/example/pd-prefill.yaml

      decode:
        count: 2
        requestGPU: 2
        profile: /profiles/example/pd-decode.yaml

      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.product
              operator: In
              values:
                - NVIDIA-H200
