# Minimal P/D Cell values for custom vLLM Production Stack 0.1.8.
#
# Inherited defaults are intentionally omitted. Router image/resources come
# from routerSpec. See pd-cell-values-full.yaml for every optional field.

pdCellSpec:
  enabled: true

  # The chart injects kv_producer/kv_consumer automatically.
  kvTransfer:
    connector: NixlConnector

  models:
    - name: example-pd-p2d2
      servedModelNames:
        - example-model
        - example-alias
      repository: vllm/vllm-openai
      tag: v0.27.1-cu129
      replicaCount: 1

      prefill:
        count: 2
        requestGPU: 2
        profile: /profiles/example/pd-prefill.yaml

      decode:
        count: 2
        requestGPU: 2
        profile: /profiles/example/pd-decode.yaml

      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.product
              operator: In
              values:
                - NVIDIA-H200
