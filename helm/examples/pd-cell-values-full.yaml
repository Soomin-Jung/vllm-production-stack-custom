# custom vLLM Production Stack 0.1.8용 P/D Cell 전체 values 예제.
#
# 이 파일의 목적은 "최소 실행 예제"가 아니라 현재 PR #4의 P/D Cell 템플릿이
# 지원하는 주요 설정을 한 파일에서 최대한 확인할 수 있는 주석형 reference를
# 제공하는 것이다.
#
# 기본 아키텍처:
#
#   클라이언트 / LiteLLM
#          |
#          v
#   전역 LMStack Router
#          |
#          v
#   P/D Cell 서비스
#          |
#          v
#   Cell 내부 vLLM Router
#          |
#      +---+---+
#      |       |
#   Prefill  Decode 엔진
#
# 핵심 규칙:
#
# - Global Router는 기존 LMStack Router를 사용할 수 있다.
# - P/D Cell 내부 Router는 항상 vllm-project/router를 사용한다.
# - P/D Cell 내부에서는 router.type / router.args / router.kvConnector를 사용하지 않는다.
# - KV backend의 source of truth는 models[].kvTransfer.connector다.
# - exact MooncakeConnector는 단일 Pod/단일 노드 전용 contract를 적용한다.
# - MooncakeConnector의 mooncake_protocol은 values에서 설정하지 않는다.
#   Chart가 최종 KVTransferConfig에 nvlink_intra를 강제로 주입한다.
# - MooncakeConnector에서는 --device-ids도 values에서 직접 지정하지 않는다.
#   Chart가 requestGPU/count를 기준으로 자동 계산한다.
# - MooncakeConnector에서 GPU extended resource는 Prefill/Decode가 직접 요청하지 않고
#   gpu-reservation container가 Cell 전체 합계를 한 번에 요청한다.
# - NIXL/MoRIIO는 위 Mooncake 전용 GPU reservation 경로를 사용하지 않는다.
#
# 주요 상속/override 순서:
#
#   servingEngineSpec / global
#       -> pdCellSpec
#       -> models[]
#       -> router / prefill / decode
#
# 단, 실제 merge 방식은 항목별로 다르다.
#
# - env: 같은 name이면 뒤 단계 값이 앞 단계 값을 덮어쓴다.
# - extraVolumes / extraVolumeMounts: 같은 name이면 뒤 단계 값이 덮어쓴다.
# - envFrom: list를 순서대로 이어 붙인다.
# - tolerations: servingEngineSpec + pdCellSpec + model 값을 이어 붙인다.
# - podAnnotations / serviceAnnotations: pdCellSpec 값에 model 값을 merge한다.
# - affinity가 비어 있지 않으면 nodeSelectorTerms보다 우선한다.
# - nodeName이 있으면 nodeSelectorTerms 기반 affinity는 만들지 않는다.
#
# 이 예제는 MooncakeConnector P1D2, Prefill TP4 + Decode TP2 + TP2를 가정한다.
# 실제 vLLM profile의 local worker GPU 수와 requestGPU는 반드시 일치해야 한다.

# -----------------------------------------------------------------------------
# 1. 기존 servingEngineSpec 중 P/D Cell이 상속/참조하는 공통 값
# -----------------------------------------------------------------------------

servingEngineSpec:
  # P/D Deployment/Service에도 붙는 공통 label.
  labels:
    environment: example
    release: pd-cell

  # P/D engine imagePullPolicy의 최상위 기본값.
  # pdCellSpec.imagePullPolicy 또는 models[].imagePullPolicy로 override 가능.
  imagePullPolicy: Always

  # GPU container runtime 지정.
  # pdCellSpec.runtimeClassName 또는 models[].runtimeClassName으로 override 가능.
  runtimeClassName: nvidia

  # 사용자 정의 GPU scheduler를 쓰는 경우 지정.
  # pdCellSpec.schedulerName 또는 models[].schedulerName으로 override 가능.
  schedulerName: gpu-binpack-scheduler

  # P/D Cell Service port의 최상위 fallback 값.
  # pdCellSpec.servicePort -> models[].servicePort 순으로 override 가능.
  servicePort: 80

  # servingEngineSpec toleration은 pdCellSpec/model toleration과 합쳐진다.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  # Pod securityContext의 가장 바깥 기본값.
  # pdCellSpec.securityContext -> models[].securityContext 순으로 merge.
  securityContext:
    fsGroup: 0

  # Prefill/Decode container 공통 securityContext의 가장 바깥 기본값.
  # pdCellSpec.containerSecurityContext -> model -> phase 순으로 merge.
  containerSecurityContext:
    runAsNonRoot: false
    allowPrivilegeEscalation: false

  # Prefill/Decode startupProbe에 사용하는 공통 기본값.
  # P/D 템플릿은 HTTP port만 phase별 engine port로 자동 변경한다.
  startupProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 360
    httpGet:
      path: /health

  # Prefill/Decode livenessProbe 공통 기본값.
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
    httpGet:
      path: /health

  # Prefill/Decode readinessProbe 공통 기본값.
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3
    httpGet:
      path: /health

  # 선택 사항: engine API key.
  #
  # 문자열을 직접 지정하면 Helm release secret을 생성/참조하는 기존 stack contract를 사용한다.
  #
  # vllmApiKey: vllm-example
  #
  # 기존 Secret을 직접 참조하려면 아래 형식 사용.
  #
  # vllmApiKey:
  #   secretName: existing-vllm-secret
  #   secretKey: api-key
  #
  # 값이 설정되면:
  #
  # - Prefill/Decode: VLLM_API_KEY
  # - Cell Router: VLLM_API_KEY + OPENAI_API_KEY
  #
  # 로 동일 credential이 전달된다.

# -----------------------------------------------------------------------------
# 2. 기존 Global Router 설정
# -----------------------------------------------------------------------------

# 이 routerSpec는 기존/global LMStack Router용이다.
# P/D Cell 내부 Router는 이 값을 상속하지 않는다.
#
# 즉 아래 image/tag는 Global routing layer용이고,
# pdCellSpec.router는 별도의 vllm-project/router image를 사용한다.
routerSpec:
  repository: lmcache/lmstack-router
  tag: 0.1.9.dev9-g37bafbcf5.d20260107
  imagePullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# 3. P/D Cell에 공통으로 상속되는 global env/volume
# -----------------------------------------------------------------------------

global:
  # global.env -> pdCellSpec.env -> model.env -> phase.env 순으로 name 기준 merge.
  env:
    - name: TZ
      value: Asia/Seoul
    - name: GLOBAL_EXAMPLE_ENV
      value: global

  # envFrom은 map merge가 아니라 list append다.
  envFrom:
    - configMapRef:
        name: shared-runtime-env
        optional: true

  # volume 정의는 name 기준 merge된다.
  extraVolumes:
    - name: model-config
      hostPath:
        path: /user/dtgpt/vllm-production-stack/profiles
        type: Directory

  # mount도 name 기준 merge된다.
  extraVolumeMounts:
    - name: model-config
      mountPath: /profiles
      readOnly: true

# -----------------------------------------------------------------------------
# 4. P/D Cell 공통 설정
# -----------------------------------------------------------------------------

pdCellSpec:
  # false면 P/D Cell Deployment/Service/launcher ConfigMap을 생성하지 않는다.
  enabled: true

  # P/D engine image pull policy 설정.
  # model 단위에서 다시 override 가능.
  imagePullPolicy: Always

  # P/D Cell Pod RuntimeClass 지정.
  runtimeClassName: nvidia

  # P/D Cell Pod scheduler 지정.
  schedulerName: gpu-binpack-scheduler

  # private registry를 사용할 때 Pod imagePullSecrets에 추가한다.
  imagePullSecret: private-registry

  # Pod ServiceAccount 지정.
  serviceAccountName: pd-cell

  # Pod PriorityClass 지정.
  priorityClassName: high-priority

  # Deployment rollout 제한 시간.
  progressDeadlineSeconds: 1800

  # Pod 종료 유예 시간.
  terminationGracePeriodSeconds: 60

  # 기본 rollout 전략.
  # P/D Cell은 같은 Pod 안의 P/D/Router를 한 단위로 다루므로 maxSurge=0을 권장한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  # 모든 P/D Cell Pod에 공통으로 붙는 annotation.
  # model.podAnnotations가 같은 key를 다시 정의하면 model 값이 우선한다.
  podAnnotations:
    prometheus.io/scrape: "true"
    example.com/pd-cell: "true"

  # servingEngineSpec.securityContext 위에 merge되는 Pod securityContext.
  securityContext:
    fsGroupChangePolicy: OnRootMismatch

  # Prefill/Decode 공통 container securityContext.
  # model 및 phase containerSecurityContext가 뒤에서 다시 merge된다.
  containerSecurityContext:
    readOnlyRootFilesystem: false

  # P/D Cell 공통 env.
  env:
    - name: COMMON_PD_ENV
      value: common

  # P/D Cell 공통 envFrom.
  envFrom:
    - secretRef:
        name: common-pd-secret
        optional: true

  # P/D Cell 공통 volume.
  extraVolumes:
    - name: common-cache
      emptyDir: {}

  # P/D Cell 공통 mount.
  extraVolumeMounts:
    - name: common-cache
      mountPath: /common-cache

  # ---------------------------------------------------------------------------
  # 4-1. Pod 배치
  # ---------------------------------------------------------------------------

  # 특정 node에 직접 고정하려면 nodeName 사용.
  # nodeName이 설정되면 아래 nodeSelectorTerms 기반 affinity는 생성하지 않는다.
  #
  # nodeName: gpu-node-01

  # affinity를 직접 작성하지 않을 때 required nodeAffinity로 변환된다.
  nodeSelectorTerms:
    - matchExpressions:
        - key: nvidia.com/gpu.product
          operator: In
          values:
            - NVIDIA-H200

  # 비어 있지 않은 affinity를 지정하면 nodeSelectorTerms보다 우선한다.
  # 아래는 예시를 위해 비워 둔다.
  affinity: {}

  # servingEngineSpec.tolerations에 이어 붙는다.
  tolerations:
    - key: example.com/pd-cell
      operator: Exists
      effect: NoSchedule

  # ---------------------------------------------------------------------------
  # 4-2. 모델별 P/D Cell Service 기본값
  # ---------------------------------------------------------------------------

  # 기본 Service type.
  # model.serviceType으로 override 가능.
  serviceType: ClusterIP

  # 외부에서 Cell Router로 들어오는 Service port.
  # 실제 targetPort는 항상 pd-router named port -> Cell Router :router.port.
  servicePort: 80

  # 공통 Service annotation.
  # model.serviceAnnotations가 merge된다.
  serviceAnnotations:
    example.com/service-scope: pd-cell

  # ---------------------------------------------------------------------------
  # 4-3. Cell 내부 vLLM Router
  # ---------------------------------------------------------------------------

  # P/D Cell 내부 orchestrator는 항상 vllm-project/router다.
  #
  # 금지:
  #
  # router.type
  # router.args
  # router.kvConnector
  #
  # Router connector mode는 models[].kvTransfer.connector에서 자동 파생한다.
  router:
    # 사내 registry에 고정한 vllm-project/router image.
    repository: internal-registry/vllm/vllm-router
    tag: v0.1.15
    imagePullPolicy: IfNotPresent

    # Cell Router API port 설정.
    port: 8000

    # Kubernetes probe 경로.
    healthPath: /health

    # vllm-router backend health check 주기.
    healthCheckInterval: 30

    # vllm-router backend health check timeout 값.
    healthCheckTimeout: 5

    # Router startupProbe 설정.
    startupProbeInitialDelaySeconds: 5
    startupProbePeriodSeconds: 5

    # Mooncake에서는 P/D health 및 Prefill bootstrap /query까지 기다릴 수 있다.
    # 180 * 5초 = 약 15분.
    startupProbeFailureThreshold: 180

    # Router livenessProbe 설정.
    livenessProbePeriodSeconds: 10
    livenessProbeFailureThreshold: 3

    # Router readinessProbe 설정.
    readinessProbePeriodSeconds: 5
    readinessProbeFailureThreshold: 3

    # vllm-router P/D backend 선택 policy.
    # P1D2 검증 시 consistent_hash 특성상 한 Decode에 요청이 몰릴 수 있으므로
    # 실제 certification에서는 hash 입력 변경 또는 임시 round-robin 검증이 필요하다.
    policy: consistent_hash

    # 0이면 별도 Router metrics port를 렌더하지 않는다.
    prometheusPort: 29000

    # Router container resource 설정.
    resources:
      requests:
        cpu: 1000m
        memory: 5Gi
      limits:
        cpu: "2"
        memory: 5Gi

    # Router는 engine 공통 containerSecurityContext를 상속하지 않는다.
    # Router 전용 securityContext를 별도로 지정한다.
    containerSecurityContext:
      allowPrivilegeEscalation: false

    # Router 환경변수.
    # PYTHONHASHSEED를 직접 주지 않으면 Chart가 123을 자동 주입한다.
    env:
      - name: ROUTER_ONLY_ENV
        value: router
      - name: PYTHONHASHSEED
        value: "123"

    # Router envFrom 설정.
    envFrom:
      - secretRef:
          name: router-secret
          optional: true

    # Router 전용 volume.
    extraVolumes:
      - name: router-config
        configMap:
          name: router-config
          optional: true

    # Router 전용 mount.
    extraVolumeMounts:
      - name: router-config
        mountPath: /etc/pd-router
        readOnly: true

    # 기본 command는 [vllm-router]다.
    # 사내 image에서 binary path가 다른 경우에만 아래처럼 override한다.
    #
    # command:
    #   - /usr/local/bin/vllm-router

    # fixed P/D contract 뒤에 추가되는 Router option.
    # --vllm-pd-disaggregation / --kv-connector / --prefill / --decode 같은
    # Chart-owned 핵심 인자를 여기서 다시 덮어쓰는 용도로 사용하지 않는다.
    extraArgs:
      - --log-level
      - info

  # ---------------------------------------------------------------------------
  # 5. 모델 목록
  # ---------------------------------------------------------------------------

  models:
    - # Kubernetes resource identity.
      # 하나의 Helm release 안에서 반드시 unique해야 한다.
      name: qwen-p1d2

      # 공개 model name 목록.
      # 첫 번째 값이 primary name이며 나머지는 alias다.
      # 중복 값은 Chart가 제거한다.
      servedModelNames:
        - Qwen3.6-27B-PD
        - test-alias

      # 구 values 호환용 단일 이름 field도 지원하지만 새 설정에서는 servedModelNames 권장.
      #
      # servedModelName: Qwen3.6-27B-PD

      # P/D vLLM engine image 지정.
      repository: vllm/vllm-openai
      tag: v0.26.0-cu129

      # 동일 P/D Cell Pod topology를 몇 replica 만들지 지정.
      # 0도 허용된다.
      replicaCount: 1

      # -----------------------------------------------------------------------
      # 5-1. model 단위 공통 override
      # -----------------------------------------------------------------------

      # pdCellSpec.imagePullPolicy를 model 단위로 override.
      imagePullPolicy: Always

      # pdCellSpec.runtimeClassName을 model 단위로 override.
      runtimeClassName: nvidia

      # pdCellSpec.schedulerName을 model 단위로 override.
      schedulerName: gpu-binpack-scheduler

      # model 단위 imagePullSecret override.
      imagePullSecret: private-registry

      # model 단위 ServiceAccount override.
      serviceAccountName: pd-cell

      # model 단위 PriorityClass override.
      priorityClassName: high-priority

      # model 단위 rollout deadline override.
      progressDeadlineSeconds: 1800

      # model 단위 Pod 종료 유예 시간 override.
      terminationGracePeriodSeconds: 60

      # model 단위 Deployment strategy override.
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1

      # model Pod annotation 설정.
      podAnnotations:
        example.com/model: qwen-p1d2

      # model Service 설정.
      serviceType: ClusterIP
      servicePort: 80
      serviceAnnotations:
        example.com/model-service: qwen-p1d2

      # model Pod securityContext 설정.
      # servingEngineSpec -> pdCellSpec -> model 순으로 merge된다.
      securityContext:
        fsGroupChangePolicy: OnRootMismatch

      # model engine container 공통 securityContext.
      # Prefill/Decode phase 값이 뒤에서 다시 merge된다.
      containerSecurityContext:
        readOnlyRootFilesystem: false

      # 특정 node에 직접 pin하려면 사용.
      # 설정하면 model nodeSelectorTerms는 사용하지 않는다.
      #
      # nodeName: gpu-node-01

      # model 단위 nodeSelectorTerms override.
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.product
              operator: In
              values:
                - NVIDIA-H200

      # model 단위 affinity override.
      # 비어 있지 않으면 model/node-level nodeSelectorTerms보다 우선한다.
      affinity: {}

      # pdCellSpec toleration 뒤에 이어 붙는다.
      tolerations:
        - key: example.com/qwen
          operator: Exists
          effect: NoSchedule

      # -----------------------------------------------------------------------
      # 5-2. model 공통 env/volume
      # -----------------------------------------------------------------------

      env:
        - name: MODEL_COMMON_ENV
          value: model

      envFrom:
        - configMapRef:
            name: model-common-env
            optional: true

      # 기존 Secret 전체를 envFrom.secretRef로 추가하는 shorthand.
      envFromSecret:
        name: model-common-secret

      extraVolumes:
        - name: model-data
          hostPath:
            path: /models/Qwen3.6-27B-PD
            type: Directory

      extraVolumeMounts:
        - name: model-data
          mountPath: /models/Qwen3.6-27B-PD
          readOnly: true

      # MooncakeConnector에서는 아래 volume/mount name을 사용하면 안 된다.
      # Chart launcher가 예약한 이름이므로 Helm render 단계에서 fail한다.
      #
      # - pd-mooncake-gpu-map
      # - pd-mooncake-gpu-launcher

      # -----------------------------------------------------------------------
      # 5-3. model 단위 Router override
      # -----------------------------------------------------------------------

      # pdCellSpec.router와 merge된다.
      # repository/tag/port/resources/probe/env/volume 등 동일 field를 model별로 override 가능.
      #
      # 단 router.type / router.args / router.kvConnector는 여전히 금지.
      router:
        # 아래 image override는 예시상 공통값과 동일하게 유지한다.
        repository: internal-registry/vllm/vllm-router
        tag: v0.1.15
        imagePullPolicy: IfNotPresent

        port: 8000
        healthPath: /health
        healthCheckInterval: 30
        healthCheckTimeout: 5

        startupProbeInitialDelaySeconds: 5
        startupProbePeriodSeconds: 5
        startupProbeFailureThreshold: 180

        livenessProbePeriodSeconds: 10
        livenessProbeFailureThreshold: 3

        readinessProbePeriodSeconds: 5
        readinessProbeFailureThreshold: 3

        policy: consistent_hash
        prometheusPort: 29000

        resources:
          requests:
            cpu: 1000m
            memory: 5Gi
          limits:
            cpu: "2"
            memory: 5Gi

        containerSecurityContext:
          allowPrivilegeEscalation: false

        env:
          - name: MODEL_ROUTER_ENV
            value: model-router

        envFrom:
          - configMapRef:
              name: model-router-env
              optional: true

        extraVolumes:
          - name: model-router-config
            emptyDir: {}

        extraVolumeMounts:
          - name: model-router-config
            mountPath: /etc/model-router

        # binary path만 바꿔야 할 때 사용.
        #
        # command:
        #   - /usr/local/bin/vllm-router

        extraArgs:
          - --log-level
          - info

      # -----------------------------------------------------------------------
      # 5-4. KV transfer backend 설정
      # -----------------------------------------------------------------------

      kvTransfer:
        # exact MooncakeConnector일 때만 PR #4의 shared GPU reservation contract가 켜진다.
        connector: MooncakeConnector

        # Prefill bootstrap base port.
        # P0=9001, P1=9002 식으로 증가한다.
        bootstrapPortBase: 9001

        # Mooncake transfer abort timeout 값.
        abortRequestTimeout: 600

        # NIXL connector는 자동으로 side-channel env를 활성화한다.
        # MultiConnector 등 특수 케이스에서 수동 override가 필요할 때만 사용한다.
        #
        # nixlSideChannelEnabled: true

        # 모든 phase에 공통 적용되는 KVTransferConfig.
        config:
          # certification에서는 connector 실패를 local recompute로 숨기지 않도록 fail 권장.
          kv_load_failure_policy: fail

          kv_connector_extra_config:
            # Mooncake worker 수 등 일반 extra config는 사용자 설정 가능.
            num_workers: 16

            # 절대 values에 넣지 않는다.
            #
            # mooncake_protocol: nvlink_intra
            #
            # exact MooncakeConnector에서는 Chart가 최종 merge 뒤 nvlink_intra를 강제한다.
            # base/prefill/decode 어느 layer에서라도 사용자가 mooncake_protocol을 넣으면
            # Helm render가 실패한다.

        # Prefill 전용 KVTransferConfig merge layer.
        # merge 순서:
        # config -> prefillConfig -> prefill.kvTransferConfig -> Chart 강제값.
        prefillConfig:
          kv_connector_extra_config:
            num_workers: 16

        # Decode 전용 KVTransferConfig merge layer.
        decodeConfig:
          kv_connector_extra_config:
            num_workers: 16

      # -----------------------------------------------------------------------
      # 5-5. Prefill topology 설정
      # -----------------------------------------------------------------------

      prefill:
        # 한 Pod 안에 생성할 Prefill container 수.
        count: 1

        # 각 Prefill engine이 실제 사용하는 local GPU worker 수.
        #
        # 이 예제는 TP4 profile이므로 4.
        #
        # MooncakeConnector에서는 이 값이:
        # - Cell 전체 GPU reservation 합계 계산
        # - 자동 CNTR_GPU_IDX 계산
        # - CPU/memory 기본 sizing
        # 의 source of truth가 된다.
        requestGPU: 4

        # exact MooncakeConnector에서는 반드시 nvidia.com/gpu여야 한다.
        # MIG/time-slicing/shared GPU resource type은 지원하지 않는다.
        requestGPUType: nvidia.com/gpu

        # vLLM --config 경로.
        profile: /profiles/qwen/prefill-tp4.yaml

        # CPU/memory request 값.
        # 생략하면 requestGPU 1개당 CPU 4000m / memory 10Gi가 기본값.
        requestCPU: "16000m"
        requestMemory: 40Gi

        # CPU/memory limit 값.
        limitCPU: "20"
        limitMemory: 48Gi

        # 아래 GPU 세부 resource는 일반 chart.resources 경로에서는 사용할 수 있지만
        # Mooncake shared GPU reservation에서는 지원하지 않는다.
        # exact MooncakeConnector에서 켜면 Helm render fail.
        #
        # requestGPUMem: "40960"
        # requestGPUMemPercentage: "100"
        # requestGPUCores: "100"
        # limitGPUMem: "40960"
        # limitGPUMemPercentage: "100"
        # limitGPUCores: "100"

        # Prefill HTTP port base 값.
        # count가 2면 8101, 8102.
        portBase: 8101

        # internal port env 주입 방식.
        #
        # vllm -> VLLM_PORT
        # dp   -> VLLM_DP_MASTER_PORT
        # auto -> 둘 다 강제하지 않음
        internalPortMode: vllm

        # VLLM_PORT용 base.
        internalPortBase: 20000

        # 여러 Prefill container에서 internal port 충돌을 피하기 위한 stride.
        internalPortStride: 100

        # internalPortMode=dp일 때 VLLM_DP_MASTER_PORT base.
        dpMasterPortBase: 24000

        # NIXL side channel base port.
        # NIXL 계열 connector 또는 nixlSideChannelEnabled=true일 때 사용.
        sideChannelPortBase: 5600

        # 일반 connector에서는 engine command를 직접 override할 수 있다.
        #
        # MooncakeConnector에서는 Chart-owned launcher가 실제 container command를 소유하므로
        # [<vllm-binary>, serve] 형태만 허용하며 binary path 추출에만 사용한다.
        #
        # command:
        #   - vllm
        #   - serve

        # vLLM serve 뒤에 추가되는 extra arg.
        #
        # MooncakeConnector에서는 --device-ids / --device-ids=...를 직접 넣으면 안 된다.
        # Chart가 자동 계산하고 launcher가 주입한다.
        extraArgs:
          - --disable-log-requests

        # Prefill 전용 env.
        # global -> pdCellSpec -> model -> prefill 순으로 name 기준 override.
        env:
          - name: PREFILL_ONLY_ENV
            value: prefill

        # Prefill 전용 envFrom.
        envFrom:
          - secretRef:
              name: prefill-secret
              optional: true

        # Prefill 전용 volume.
        extraVolumes:
          - name: prefill-cache
            emptyDir: {}

        # Prefill 전용 mount.
        extraVolumeMounts:
          - name: prefill-cache
            mountPath: /prefill-cache

        # Prefill container securityContext 최종 override.
        containerSecurityContext:
          allowPrivilegeEscalation: false

        # Prefill 최종 phase-specific KVTransferConfig.
        # kvTransfer.prefillConfig 뒤에 merge된다.
        #
        # Chart는 merge 완료 후 kv_connector=MooncakeConnector,
        # kv_role=kv_producer를 강제로 설정한다.
        kvTransferConfig:
          kv_connector_extra_config:
            num_workers: 16

      # -----------------------------------------------------------------------
      # 5-6. Decode topology 설정
      # -----------------------------------------------------------------------

      decode:
        # 한 Pod 안에 생성할 Decode container 수.
        count: 2

        # 각 Decode engine local GPU worker 수.
        # 이 예제는 Decode 각각 TP2이므로 2.
        requestGPU: 2

        # exact MooncakeConnector에서는 nvidia.com/gpu만 허용.
        requestGPUType: nvidia.com/gpu

        # vLLM --config 경로.
        profile: /profiles/qwen/decode-tp2.yaml

        # CPU/memory request 값.
        requestCPU: "8000m"
        requestMemory: 20Gi

        # CPU/memory limit 값.
        limitCPU: "10"
        limitMemory: 24Gi

        # Mooncake에서는 아래 GPU 세부 resource 설정 금지.
        #
        # requestGPUMem: "20480"
        # requestGPUMemPercentage: "100"
        # requestGPUCores: "100"
        # limitGPUMem: "20480"
        # limitGPUMemPercentage: "100"
        # limitGPUCores: "100"

        # Decode HTTP port base 값.
        # count=2이면 8201, 8202.
        portBase: 8201

        # 허용 값은 vllm / dp / auto.
        internalPortMode: vllm

        # VLLM_PORT base 값.
        internalPortBase: 30000

        # 여러 Decode container의 internal port 간격.
        internalPortStride: 100

        # internalPortMode=dp일 때 VLLM_DP_MASTER_PORT base.
        dpMasterPortBase: 34000

        # NIXL side channel base port.
        sideChannelPortBase: 5700

        # Mooncake command override 규칙은 Prefill과 동일.
        #
        # command:
        #   - vllm
        #   - serve

        # --device-ids는 Mooncake에서 직접 넣지 않는다.
        extraArgs:
          - --disable-log-requests

        # Decode 전용 env.
        env:
          - name: DECODE_ONLY_ENV
            value: decode

        # Decode 전용 envFrom.
        envFrom:
          - secretRef:
              name: decode-secret
              optional: true

        # Decode 전용 volume.
        extraVolumes:
          - name: decode-cache
            emptyDir: {}

        # Decode 전용 mount.
        extraVolumeMounts:
          - name: decode-cache
            mountPath: /decode-cache

        # Decode container securityContext 최종 override.
        containerSecurityContext:
          allowPrivilegeEscalation: false

        # Decode 최종 phase-specific KVTransferConfig.
        #
        # Chart는 merge 완료 후 kv_connector=MooncakeConnector,
        # kv_role=kv_consumer를 강제로 설정한다.
        kvTransferConfig:
          kv_connector_extra_config:
            num_workers: 16

# -----------------------------------------------------------------------------
# 6. 위 Mooncake P1D2가 실제로 만드는 GPU partition
# -----------------------------------------------------------------------------
#
# 현재 값:
#
#   Prefill count=1, requestGPU=4
#   Decode  count=2, requestGPU=2
#
# 따라서:
#
#   Cell total GPU = 1*4 + 2*2 = 8
#
# Chart가 자동 생성:
#
#   gpu-reservation -> nvidia.com/gpu: 8
#   prefill-0       -> CNTR_GPU_IDX=0,1,2,3
#   decode-0        -> CNTR_GPU_IDX=4,5
#   decode-1        -> CNTR_GPU_IDX=6,7
#
# P/D engine에는 nvidia.com/gpu resource를 직접 붙이지 않는다.
# 대신 manifest 단계에서 NVIDIA_VISIBLE_DEVICES=all을 주입하고,
# launcher가 reservation GPU UUID 목록만 CUDA_VISIBLE_DEVICES로 다시 제한한다.
#
# 운영자가 GPU UUID나 index range를 직접 작성할 필요가 없다.

# -----------------------------------------------------------------------------
# 7. NIXL로 전환할 때의 차이
# -----------------------------------------------------------------------------
#
# 아래는 구조 참고용이며 현재 active model에는 적용하지 않는다.
#
# kvTransfer:
#   connector: NixlConnector
#   nixlSideChannelEnabled: true
#   config:
#     kv_buffer_device: cuda
#     kv_load_failure_policy: fail
#     kv_connector_extra_config:
#       backends:
#         - UCX
#
# NIXL에서는:
#
# - Mooncake gpu-reservation container를 생성하지 않는다.
# - Prefill/Decode가 기존처럼 각자 nvidia.com/gpu resource를 직접 요청한다.
# - NVIDIA_VISIBLE_DEVICES=all을 Chart가 강제하지 않는다.
# - CNTR_GPU_IDX / Mooncake launcher를 사용하지 않는다.
# - VLLM_NIXL_SIDE_CHANNEL_PORT를 phase/index별로 자동 주입한다.
# - requestGPUMem/requestGPUCores 계열 extended resource를 기존 helper에서 사용할 수 있다.
#
# 예:
#
# prefill:
#   count: 1
#   requestGPU: 4
#   requestGPUType: nvidia.com/gpu
#   requestGPUMem: "81920"
#   requestGPUMemPercentage: "100"
#   requestGPUCores: "100"
#   limitGPUMem: "81920"
#   limitGPUMemPercentage: "100"
#   limitGPUCores: "100"
#   profile: /profiles/qwen/prefill-tp4.yaml
#
# decode:
#   count: 2
#   requestGPU: 2
#   requestGPUType: nvidia.com/gpu
#   profile: /profiles/qwen/decode-tp2.yaml
#
# NixlPullConnector / NixlPushConnector도 Router mode는 nixl로 자동 매핑된다.

# -----------------------------------------------------------------------------
# 8. MoRIIO 계열로 전환할 때의 차이
# -----------------------------------------------------------------------------
#
# 예:
#
# kvTransfer:
#   connector: MoRIIOConnector
#   config: {}
#
# 이름에 Mori 또는 MoRI가 포함된 connector는 Router mode=moriio로 매핑된다.
#
# 단, Router가 moriio mode를 안다는 사실과 사용하는 vLLM engine image가 해당
# connector/version/platform을 지원한다는 사실은 별개다.
# 실제 MoRIIO는 AMD/ROCm 계열 capability를 별도로 검증해야 한다.
#
# Mooncake 전용 gpu-reservation/nvlink_intra 강제 정책은 적용하지 않는다.

# -----------------------------------------------------------------------------
# 9. 금지/주의 설정 요약
# -----------------------------------------------------------------------------
#
# P/D Cell Router에서 사용 금지:
#
#   pdCellSpec.router.type
#   pdCellSpec.router.args
#   pdCellSpec.router.kvConnector
#
# exact MooncakeConnector에서 사용 금지:
#
#   kv_connector_extra_config.mooncake_protocol
#   prefill.extraArgs의 --device-ids
#   decode.extraArgs의 --device-ids
#   requestGPUMem / requestGPUMemPercentage / requestGPUCores
#   limitGPUMem / limitGPUMemPercentage / limitGPUCores
#   requestGPUType != nvidia.com/gpu
#
# Mooncake에서 Chart가 자동 소유하는 값:
#
#   mooncake_protocol=nvlink_intra
#   NVIDIA_VISIBLE_DEVICES=all
#   CUDA_VISIBLE_DEVICES=<Cell reservation UUID 목록>
#   CNTR_GPU_IDX
#   vllm serve --device-ids
#   VLLM_MOONCAKE_BOOTSTRAP_PORT
#   VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT
#   kv_role=kv_producer / kv_consumer
#   kv_connector=MooncakeConnector
#
# 모든 P/D engine에서 Chart가 자동 주입하는 값:
#
#   POD_IP
#   PROMETHEUS_MULTIPROC_DIR=/tmp
#
# Router에서 PYTHONHASHSEED를 직접 지정하지 않으면 123을 자동 주입한다.

# -----------------------------------------------------------------------------
# 10. Runtime certification 시 반드시 확인할 항목
# -----------------------------------------------------------------------------
#
# 1) gpu-reservation이 기대 GPU 총합을 받았는가
# 2) reservation file의 UUID 개수가 기대값과 같은가
# 3) 모든 Mooncake P/D engine이 동일 CUDA_VISIBLE_DEVICES를 갖는가
# 4) CNTR_GPU_IDX가 중복 없이 전체 GPU range를 정확히 분할하는가
# 5) 각 requestGPU가 실제 profile의 local GPU worker 수와 일치하는가
# 6) Router가 Prefill bootstrap /query에서 engine_id를 얻는가
# 7) 같은 request에서 Prefill/Decode transfer_id가 동일한가
# 8) Decode metadata에 remote_engine_id/remote_bootstrap_addr가 존재하는가
# 9) cudaIpcOpenMemHandle이 실제 성공하는가
# 10) Prefill 실제 KV send와 Decode receive/load가 확인되는가
# 11) Decode가 prompt를 local recompute하지 않는가
# 12) P1D2에서 Decode 두 개 모두 실제 transfer를 받는지 확인했는가
#
# HTTP 200 또는 정상 text generation만으로 P/D KV transfer PASS 처리하지 않는다.
