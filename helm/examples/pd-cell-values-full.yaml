# P/D Cell full values reference for custom vLLM Production Stack 0.1.8.
#
# Architecture rule:
#   Global Router  : LMStack Router may be used as the platform/global router.
#   Cell Router    : ALWAYS vllm-project/router. router.type is intentionally removed.
#   KV connector   : declared per model and translated to vllm-router's connector mode.
#
# vllm-router v0.1.15 is the minimum pinned baseline used by this chart for
# Mooncake orchestration. Docker Hub has no release-tagged image for this
# baseline; package the official release wheel into the internal registry by
# following docker/vllm-router/README.md and pin the resulting image/digest.

servingEngineSpec:
  labels:
    environment: example
    release: pd-cell
  imagePullPolicy: Always
  runtimeClassName: nvidia
  schedulerName: gpu-binpack-scheduler
  servicePort: 80
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  securityContext: {}
  containerSecurityContext:
    runAsNonRoot: false
  startupProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 360
    httpGet:
      path: /health
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
    httpGet:
      path: /health
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3
    httpGet:
      path: /health
  # Optional engine API key. When set, the Cell router receives the same secret
  # as OPENAI_API_KEY for router -> Prefill/Decode Authorization and as
  # VLLM_API_KEY for compatibility with the rest of the stack.
  # vllmApiKey: vllm-example
  # vllmApiKey:
  #   secretName: existing-vllm-secret
  #   secretKey: api-key

# routerSpec belongs to the existing/global LMStack Router and is deliberately
# NOT inherited by pdCellSpec.router. Keeping it here demonstrates that both can
# coexist without accidentally launching LMStack inside a P/D Cell.
routerSpec:
  repository: lmcache/lmstack-router
  tag: 0.1.9.dev9-g37bafbcf5.d20260107
  imagePullPolicy: IfNotPresent

# Common container inheritance used by the Cell.
global:
  env:
    - name: TZ
      value: Asia/Seoul
  envFrom:
    - configMapRef:
        name: shared-runtime-env
        optional: true
  extraVolumes:
    - name: model-config
      hostPath:
        path: /user/dtgpt/vllm-production-stack/profiles
        type: Directory
  extraVolumeMounts:
    - name: model-config
      mountPath: /profiles

pdCellSpec:
  enabled: true

  imagePullPolicy: Always
  runtimeClassName: nvidia
  schedulerName: gpu-binpack-scheduler
  imagePullSecret: private-registry
  serviceAccountName: pd-cell
  priorityClassName: high-priority
  progressDeadlineSeconds: 1800
  terminationGracePeriodSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  podAnnotations:
    prometheus.io/scrape: "true"
  securityContext: {}
  containerSecurityContext: {}

  env:
    - name: COMMON_PD_ENV
      value: common
  envFrom:
    - secretRef:
        name: common-pd-secret
        optional: true
  extraVolumes:
    - name: common-cache
      emptyDir: {}
  extraVolumeMounts:
    - name: common-cache
      mountPath: /common-cache

  # Pod scheduling options. affinity takes precedence over nodeSelectorTerms.
  # nodeName: gpu-node-01
  nodeSelectorTerms:
    - matchExpressions:
        - key: nvidia.com/gpu.product
          operator: In
          values:
            - NVIDIA-H200
  affinity: {}
  tolerations:
    - key: example.com/pd-cell
      operator: Exists
      effect: NoSchedule

  serviceType: ClusterIP
  servicePort: 80
  serviceAnnotations: {}

  # Cell-local P/D orchestrator: ALWAYS vllm-project/router.
  # There is no router.type selector and no full router.args escape hatch.
  router:
    repository: internal-registry/vllm/vllm-router
    tag: v0.1.15
    imagePullPolicy: IfNotPresent
    port: 8000
    healthPath: /health
    healthCheckInterval: 30
    healthCheckTimeout: 5
    startupProbeInitialDelaySeconds: 5
    startupProbePeriodSeconds: 5
    # Mooncake direct-URL startup waits for P/D health and bootstrap /query.
    # 180 * 5s = 15 minutes by default.
    startupProbeFailureThreshold: 180
    livenessProbePeriodSeconds: 10
    livenessProbeFailureThreshold: 3
    readinessProbePeriodSeconds: 5
    readinessProbeFailureThreshold: 3
    policy: consistent_hash
    prometheusPort: 29000
    resources:
      requests:
        cpu: 1000m
        memory: 5Gi
      limits:
        memory: 5Gi
    containerSecurityContext: {}
    env:
      - name: ROUTER_ONLY_ENV
        value: router
    envFrom:
      - secretRef:
          name: router-secret
          optional: true
    extraVolumes:
      - name: router-config
        configMap:
          name: router-config
          optional: true
    extraVolumeMounts:
      - name: router-config
        mountPath: /etc/pd-router
        readOnly: true
    # The chart supplies command: [vllm-router] by default. Override only for a
    # validated custom image layout, not to switch router implementations.
    # command: [/usr/local/bin/vllm-router]
    # Additional vllm-router flags appended after the fixed P/D contract.
    extraArgs:
      - --log-level
      - info

  models:
    - name: qwen-p1d2
      servedModelNames:
        - Qwen3.6-27B-PD
        - test-alias
      repository: vllm/vllm-openai
      tag: v0.26.0-cu129
      replicaCount: 1
      modelType: chat

      env:
        - name: MODEL_COMMON_ENV
          value: model
      envFrom:
        - configMapRef:
            name: model-common-env
            optional: true
      envFromSecret:
        name: model-common-secret
      extraVolumes:
        - name: model-data
          hostPath:
            path: /models/Qwen3.6-27B-PD
            type: Directory
      extraVolumeMounts:
        - name: model-data
          mountPath: /models/Qwen3.6-27B-PD
          readOnly: true

      # Model-level router settings can override image/resources/probes/env but
      # cannot change the router implementation or KV connector mapping.
      router:
        env:
          - name: MODEL_ROUTER_ENV
            value: model-router

      kvTransfer:
        connector: MooncakeConnector
        bootstrapPortBase: 9001
        abortRequestTimeout: 600
        # Mooncake protocol is chart-owned and forced to nvlink_intra for
        # this node-local P/D Cell. Other Mooncake options remain configurable.
        config:
          kv_load_failure_policy: fail
          kv_connector_extra_config:
            num_workers: 16
        # Optional phase-specific connector config merges.
        prefillConfig: {}
        decodeConfig: {}

      prefill:
        count: 1
        requestGPU: 4
        profile: /profiles/qwen/prefill-tp4.yaml
        requestCPU: "16000m"
        requestMemory: 40Gi
        requestGPUType: nvidia.com/gpu
        limitCPU: "20"
        limitMemory: 48Gi
        portBase: 8101
        internalPortMode: vllm
        internalPortBase: 20000
        internalPortStride: 100
        dpMasterPortBase: 24000
        sideChannelPortBase: 5600
        # MooncakeConnector is launched through the chart-owned GPU wrapper.
        # Optional command override is limited to [<vllm-binary>, serve].
        # command: [vllm, serve]
        extraArgs:
          - --disable-log-requests
        env:
          - name: PREFILL_ONLY_ENV
            value: prefill
        envFrom:
          - secretRef:
              name: prefill-secret
              optional: true
        extraVolumes:
          - name: prefill-cache
            emptyDir: {}
        extraVolumeMounts:
          - name: prefill-cache
            mountPath: /prefill-cache
        containerSecurityContext: {}
        kvTransferConfig: {}

      decode:
        count: 2
        requestGPU: 2
        profile: /profiles/qwen/decode-tp2.yaml
        requestCPU: "8000m"
        requestMemory: 20Gi
        requestGPUType: nvidia.com/gpu
        limitCPU: "10"
        limitMemory: 24Gi
        portBase: 8201
        internalPortMode: vllm
        internalPortBase: 30000
        internalPortStride: 100
        dpMasterPortBase: 34000
        sideChannelPortBase: 5700
        # MooncakeConnector is launched through the chart-owned GPU wrapper.
        # Optional command override is limited to [<vllm-binary>, serve].
        # command: [vllm, serve]
        extraArgs:
          - --disable-log-requests
        env:
          - name: DECODE_ONLY_ENV
            value: decode
        envFrom:
          - secretRef:
              name: decode-secret
              optional: true
        extraVolumes:
          - name: decode-cache
            emptyDir: {}
        extraVolumeMounts:
          - name: decode-cache
            mountPath: /decode-cache
        containerSecurityContext: {}
        kvTransferConfig: {}
