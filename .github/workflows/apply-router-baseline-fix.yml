name: Apply router baseline resource fix

on:
  push:
    branches:
      - agent/production-0.1.8-baseline-final
    paths:
      - .github/workflows/apply-router-baseline-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-0.1.8-baseline-final
          fetch-depth: 0

      - name: Align router resources with production baseline
        shell: python
        run: |
          from pathlib import Path

          path = Path("helm/values.yaml")
          text = path.read_text()

          old = '''  resources:
    requests:
      cpu: 400m
      memory: 500Mi
    limits:
      cpu: 1000m # default: unset
      memory: 5Gi # default: 500Mi
'''
          new = '''  resources:
    requests:
      cpu: 1000m
      memory: 5Gi
    limits:
      memory: 5Gi
'''

          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("expected exactly one router resource block")
              path.write_text(text.replace(old, new, 1))
          elif new in text:
              print("router resources already match production baseline")
          else:
              raise SystemExit("router resource block did not match expected old or new form")

      - name: Commit and push when changed
        shell: bash
        run: |
          if git diff --quiet -- helm/values.yaml; then
            echo "No values.yaml change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "Align router resources with production baseline"
          git push origin HEAD:agent/production-0.1.8-baseline-final
