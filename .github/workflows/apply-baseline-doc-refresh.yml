name: Apply baseline documentation refresh

on:
  push:
    branches:
      - agent/production-0.1.8-baseline-final
    paths:
      - .github/workflows/apply-baseline-doc-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-0.1.8-baseline-final

      - name: Refresh baseline docs and Ray comment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ray = Path('helm/templates/ray-cluster.yaml')
          text = ray.read_text(encoding='utf-8')
          old = '''      # 모델 경로는 profile yaml에서 관리하므로 positional modelURL 전달을 비활성화함.\n      # {{ $modelSpec.modelURL | quote }}'''
          new = '''      # modelURL positional 인자는 profile yaml에서 관리하므로 아래 행은 비활성화.\n      # {{ $modelSpec.modelURL | quote }}'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('Ray entrypoint comment block not found')
          ray.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '`deploy-models.yaml` and the production profile set are separate operational inputs and are not yet captured by this baseline commit series.'
          new = ('`deploy-models.yaml` is captured as a representative production `modelSpec` pattern rather than a complete model inventory, because the deployed model list changes frequently. '
                 'Production `/profiles/*.yaml` remain external hostPath runtime configuration and are intentionally not duplicated here until exact offline profile contents are captured.')
          if old in text:
              text = text.replace(old, new, 1)

          anchor = 'Ray follows the same profile direction for the model path: the generated `vllm-entrypoint.sh` no longer injects `modelSpec.modelURL` as the positional model argument. The remaining Ray command construction is retained from the 0.1.8 baseline.\n'
          addition = '''\n#### Operational model values and profile lifecycle\n\n`deploy-models.yaml` keeps only the Kubernetes/model-placement inputs that must vary per deployment: image/tag, replica count, GPU request, node placement, optional LMCache controls, `vllmConfig.extraArgs`, and exceptional per-model environment overrides. The representative shared-GPU pooling pattern intentionally uses `requestGPU: 0`, pins a node with `nodeName`, and sets `NVIDIA_VISIBLE_DEVICES` explicitly.\n\nAll non-dynamic vLLM engine arguments are centralized in a single profile YAML referenced by `--config /profiles/<profile>.yaml`. Updating that hostPath profile does not require a Helm upgrade; the change takes effect when pods that reference the profile are restarted. Dynamic values that must be rendered from Helm, such as the current KV transfer role/failure policy path, remain in the template rather than the profile.\n\n`deploy-template-generate-multinode-ib.yaml` is tracked separately as a Kimi-K3 Ray + IB/GDRDMA validation values file. It represents the current H200 multi-node test shape, including the IPoIB network annotation, RDMA resource request shape, profile reference, and the physical `NCCL_IB_HCA=mlx5_0,mlx5_1,mlx5_6,mlx5_7` mapping. Troubleshooting NCCL/CUDA switches stay commented until explicitly needed.\n'''
          if addition.strip() not in text:
              if anchor not in text:
                  raise RuntimeError('README profile anchor not found')
              text = text.replace(anchor, anchor + addition, 1)

          debt_anchor = '- **`values.schema.json` does not match the customized resource helper.**'
          debt = ('- **Upstream 0.1.8 non-Ray multi-model document separation must be verified against the offline production chart.** '
                  'A synthetic render with multiple non-Ray `modelSpec` entries can concatenate a document separator and the next `apiVersion` (`---apiVersion`) because of whitespace trimming at the end of `deployment-vllm-multi.yaml`. '
                  'The baseline leaves this source unchanged until the exact offline production render is compared.\n')
          if debt not in text:
              if debt_anchor not in text:
                  raise RuntimeError('README technical debt anchor not found')
              text = text.replace(debt_anchor, debt + debt_anchor, 1)

          readme.write_text(text, encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet; then
            echo 'Baseline documentation already refreshed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/templates/ray-cluster.yaml README.md
          git commit -m "docs: capture model values and profile lifecycle"
          git push origin HEAD:agent/production-0.1.8-baseline-final
