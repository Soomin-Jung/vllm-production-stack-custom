name: Apply comment style fix

on:
  push:
    branches:
      - agent/production-0.1.8-baseline-final
    paths:
      - .github/workflows/apply-comment-style-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-0.1.8-baseline-final

      - name: Normalize reviewed comments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          router = Path('helm/templates/deployment-router.yaml')
          text = router.read_text(encoding='utf-8')
          old = '      # CPU 노드 리소스 부족으로 GPU 서버 활용\n      tolerations:'
          new = '      {{/* CPU 노드 리소스 부족으로 GPU 서버 활용 */}}\n      tolerations:'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('router comment target not found')
          router.write_text(text, encoding='utf-8')

          ray = Path('helm/templates/ray-cluster.yaml')
          lines = ray.read_text(encoding='utf-8').splitlines()
          marker = '모델 경로는 profile yaml에서 관리하므로 positional modelURL 전달을 비활성화함.'
          found = False
          for i, line in enumerate(lines):
              if marker in line:
                  lines[i] = '      ' + chr(35) + ' ' + marker
                  if i + 1 >= len(lines) or '$modelSpec.modelURL | quote' not in lines[i + 1]:
                      raise RuntimeError('ray modelURL comment line not found')
                  lines[i + 1] = '      ' + chr(35) + ' {{ $modelSpec.modelURL | quote }}'
                  found = True
                  break
          if not found:
              raise RuntimeError('ray entrypoint comment marker not found')
          ray.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet; then
            echo 'Comment style already normalized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/templates/deployment-router.yaml helm/templates/ray-cluster.yaml
          git commit -m "fix: normalize baseline comments"
          git push origin HEAD:agent/production-0.1.8-baseline-final
