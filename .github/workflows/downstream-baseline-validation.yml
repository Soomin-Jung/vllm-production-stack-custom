name: Validate downstream production baseline

on:
  push:
    branches:
      - main
    paths:
      - helm/**
      - global-values.yaml
      - .github/workflows/downstream-baseline-validation.yml
  pull_request:
    paths:
      - helm/**
      - global-values.yaml
      - .github/workflows/downstream-baseline-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Create schema-compliant smoke values
        shell: bash
        run: |
          cat > /tmp/smoke-values.yaml <<'EOF'
          servingEngineSpec:
            modelSpec:
              - name: smoke
                repository: vllm/vllm-openai
                tag: latest
                replicaCount: 1
                modelURL: /models/unused-by-template
                requestGPU: 0
                requestCPU: 1
                requestMemory: 4Gi
                pvcStorage: 1Gi
                vllmConfig:
                  extraArgs:
                    - --config
                    - /profiles/smoke.yaml
                env:
                  - name: TZ
                    value: ModelOverride/Zone

              - name: smoke-ray
                repository: vllm/vllm-openai
                tag: latest
                replicaCount: 1
                modelURL: /models/unused-by-ray-entrypoint
                requestGPU: 1
                requestCPU: 4
                requestMemory: 16Gi
                pvcStorage: 1Gi
                vllmConfig:
                  tensorParallelSize: 2
                  extraArgs:
                    - --config
                    - /profiles/smoke-ray.yaml
                raySpec:
                  headNode:
                    requestGPU: 0
                    requestCPU: 1
                    requestMemory: 4Gi
          EOF

      - name: Helm lint with upstream schema
        run: helm lint ./helm -f global-values.yaml -f /tmp/smoke-values.yaml

      - name: Render schema-compliant chart
        run: helm template lln ./helm -n inference -f global-values.yaml -f /tmp/smoke-values.yaml > /tmp/rendered.yaml

      - name: Verify production runtime invariants
        shell: bash
        run: |
          set -euo pipefail

          contains() {
            local label="$1"
            local needle="$2"
            echo "Checking: $label"
            grep -Fq -- "$needle" /tmp/rendered.yaml || {
              echo "Missing rendered invariant: $label ($needle)"
              exit 1
            }
          }

          contains 'requestGPU=0 model rendered' 'lln-smoke'
          contains 'profile flag rendered' '--config'
          contains 'non-Ray profile path rendered' '/profiles/smoke.yaml'
          if grep -Fq -- '/models/unused-by-template' /tmp/rendered.yaml; then
            echo 'non-Ray modelURL unexpectedly rendered into workload output'
            exit 1
          fi

          contains 'global VLLM cache env' 'VLLM_CACHE_ROOT'
          contains 'global VLLM cache path' '/vllm_cache/.cache/vllm'
          contains 'per-model env override' 'ModelOverride/Zone'
          contains 'host shm path' 'path: /dev/shm'
          contains 'hostPath directory type' 'type: Directory'
          contains 'Ray shm default' 'sizeLimit: 100Gi'
          contains 'model weights mount' 'mountPath: /models'
          contains 'profiles mount' 'mountPath: /profiles'
          contains 'cache mount' 'mountPath: /vllm_cache'

      - name: Verify GPU-derived CPU and memory fallbacks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fallback-values.yaml <<'EOF'
          servingEngineSpec:
            modelSpec:
              - name: fallback
                repository: vllm/vllm-openai
                tag: latest
                replicaCount: 1
                modelURL: /models/unused-by-template
                requestGPU: 2
                vllmConfig:
                  extraArgs:
                    - --config
                    - /profiles/fallback.yaml
          EOF

          # Upstream 0.1.8 values.schema.json still requires requestCPU,
          # requestMemory and pvcStorage. Remove only the schema copy in this
          # ephemeral CI checkout to test the customized helper fallback itself.
          mv helm/values.schema.json /tmp/values.schema.json
          trap 'mv /tmp/values.schema.json helm/values.schema.json' EXIT
          helm template lln ./helm -n inference -f global-values.yaml -f /tmp/fallback-values.yaml > /tmp/fallback-rendered.yaml
          mv /tmp/values.schema.json helm/values.schema.json
          trap - EXIT

          grep -Fq '8000m' /tmp/fallback-rendered.yaml
          grep -Fq '20Gi' /tmp/fallback-rendered.yaml
