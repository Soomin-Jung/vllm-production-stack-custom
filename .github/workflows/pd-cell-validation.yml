name: Validate P-D Cell Helm extension

on:
  pull_request:
    paths:
      - 'helm/templates/deployment-pd-cell.yaml'
      - 'helm/templates/service-pd-cell.yaml'
      - 'helm/examples/pd-cell-values.yaml'
      - 'helm/examples/pd-cell-values-full.yaml'
      - 'helm/tests/pdCell_test.yaml'
      - 'helm/docs/PD_CELL_0.1.8_KO.md'
      - 'helm/docs/PD_CELL_VALUES_REFERENCE_KO.md'
      - '.github/workflows/pd-cell-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pd-cell-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Helm lint examples
        shell: bash
        run: |
          set -euo pipefail
          helm lint ./helm \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml
          helm lint ./helm \
            -f helm/examples/pd-cell-values-full.yaml

      - name: Render Mooncake P-D Cell baseline
        shell: bash
        run: |
          set -euo pipefail
          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            > /tmp/pd-cell.yaml

      - name: Verify fixed vLLM Router orchestration contract
        shell: bash
        run: |
          set -euo pipefail

          contains() {
            local needle="$1"
            grep -Fq -- "$needle" /tmp/pd-cell.yaml || {
              echo "Missing rendered P/D invariant: $needle"
              exit 1
            }
          }

          absent() {
            local needle="$1"
            if grep -Fq -- "$needle" /tmp/pd-cell.yaml; then
              echo "Legacy/forbidden P/D invariant still rendered: $needle"
              exit 1
            fi
          }

          contains 'kind: Deployment'
          contains 'pd-test-example-pd-p1d1-pd-cell'
          contains 'pd-orchestrator: "vllm-router"'
          contains 'pd-kv-connector: "mooncake"'
          contains 'name: pd-router'
          contains '- vllm-router'
          contains '--vllm-pd-disaggregation'
          contains '--kv-connector'
          contains 'mooncake'
          contains '--prefill'
          contains 'http://127.0.0.1:8101'
          contains '"9001"'
          contains '--decode'
          contains 'http://127.0.0.1:8201'
          contains '--health-check-interval-secs'
          contains '--health-check-timeout-secs'
          contains '--prometheus-port'
          contains 'containerPort: 29000'
          contains 'MooncakeConnector'
          contains 'kv_producer'
          contains 'kv_consumer'
          contains 'name: VLLM_MOONCAKE_BOOTSTRAP_PORT'
          contains 'name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT'
          contains 'nvlink_intra'
          contains '--served-model-name'
          contains '"example-alias"'
          contains 'name: PROMETHEUS_MULTIPROC_DIR'
          contains 'value: /tmp'
          contains 'targetPort: pd-router'

          absent 'disaggregated_prefill_orchestrated'
          absent '--static-backends'
          absent '--static-models'
          absent '--static-aliases'

      - name: Verify NIXL mapping still uses vLLM Router
        shell: bash
        run: |
          set -euo pipefail
          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            --set-string 'pdCellSpec.models[0].kvTransfer.connector=NixlConnector' \
            --set-string 'pdCellSpec.models[0].kvTransfer.config.kv_connector_extra_config.backends[0]=UCX' \
            > /tmp/pd-nixl.yaml

          grep -Fq -- 'pd-orchestrator: "vllm-router"' /tmp/pd-nixl.yaml
          grep -Fq -- 'pd-kv-connector: "nixl"' /tmp/pd-nixl.yaml
          grep -Fq -- '--vllm-pd-disaggregation' /tmp/pd-nixl.yaml
          grep -Fq -- 'NixlConnector' /tmp/pd-nixl.yaml
          grep -Fq -- 'name: VLLM_NIXL_SIDE_CHANNEL_PORT' /tmp/pd-nixl.yaml

      - name: Verify API-key propagation to Cell router
        shell: bash
        run: |
          set -euo pipefail
          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            --set-string servingEngineSpec.vllmApiKey=test-api-key \
            > /tmp/pd-auth.yaml

          grep -Fq -- 'name: OPENAI_API_KEY' /tmp/pd-auth.yaml
          grep -Fq -- 'name: VLLM_API_KEY' /tmp/pd-auth.yaml

      - name: Verify legacy Cell router selector is rejected
        shell: bash
        run: |
          set -euo pipefail
          if helm template pd-test ./helm -n inference \
              -f global-values.yaml \
              -f helm/examples/pd-cell-values.yaml \
              --set-string pdCellSpec.router.type=lmstack \
              > /tmp/pd-legacy.yaml 2>/tmp/pd-legacy.err; then
            echo 'router.type=lmstack must not be accepted inside P/D Cell'
            exit 1
          fi
          grep -Fq -- 'router.type was removed' /tmp/pd-legacy.err

      - name: Run P-D Cell helm-unittest suite
        shell: bash
        run: |
          set -euo pipefail
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 0.8.2
          helm unittest ./helm -f 'tests/pdCell_test.yaml'

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pd-cell-rendered-manifests
          path: |
            /tmp/pd-cell.yaml
            /tmp/pd-nixl.yaml
            /tmp/pd-auth.yaml
