name: Validate P-D Cell Helm extension

on:
  pull_request:
    paths:
      - 'helm/templates/deployment-pd-cell.yaml'
      - 'helm/templates/service-pd-cell.yaml'
      - 'helm/examples/pd-cell-values.yaml'
      - 'helm/examples/pd-cell-values-full.yaml'
      - 'helm/tests/pdCell_test.yaml'
      - 'helm/docs/PD_CELL_0.1.8_KO.md'
      - 'helm/docs/PD_CELL_VALUES_REFERENCE_KO.md'
      - '.github/workflows/pd-cell-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pd-cell-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Render debug output
        shell: bash
        run: |
          set +e
          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            --debug > /tmp/pd-debug.txt 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '--- Helm debug output ---'
            cat /tmp/pd-debug.txt
          fi
          exit 0

      - name: Helm lint P-D Cell example
        run: |
          helm lint ./helm \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml
          helm lint ./helm \
            -f helm/examples/pd-cell-values-full.yaml

      - name: Render P-D Cell example
        run: |
          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            > /tmp/pd-cell.yaml

      - name: Verify rendered P-D Cell invariants
        shell: bash
        run: |
          set -euo pipefail

          contains() {
            local needle="$1"
            grep -Fq -- "$needle" /tmp/pd-cell.yaml || {
              echo "Missing rendered P/D invariant: $needle"
              exit 1
            }
          }

          contains 'kind: Deployment'
          contains 'pd-test-example-pd-p2d2-pd-cell'
          contains 'name: pd-router'
          contains 'name: prefill-0'
          contains 'name: prefill-1'
          contains 'name: decode-0'
          contains 'name: decode-1'
          contains 'containerPort: 8101'
          contains 'containerPort: 8102'
          contains 'containerPort: 8201'
          contains 'containerPort: 8202'
          contains 'disaggregated_prefill_orchestrated'
          contains 'NixlConnector'
          contains 'kv_producer'
          contains 'kv_consumer'
          contains 'name: VLLM_NIXL_SIDE_CHANNEL_PORT'
          contains 'name: VLLM_PORT'
          contains 'name: PROMETHEUS_MULTIPROC_DIR'
          contains 'value: /tmp'
          contains '--static-aliases'
          contains 'example-alias:example-model'
          contains '--served-model-name'
          contains '"example-alias"'
          contains '/profiles/example/pd-prefill.yaml'
          contains '/profiles/example/pd-decode.yaml'
          contains 'pd-cell: "true"'
          contains 'targetPort: pd-router'

      - name: Verify Cell replica and GPU resource model
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- 'replicas: 1' /tmp/pd-cell.yaml
          test "$(grep -c -- 'nvidia.com/gpu: "2"' /tmp/pd-cell.yaml)" -ge 4
          test "$(grep -c -- 'cpu: "8000m"' /tmp/pd-cell.yaml)" -ge 4
          test "$(grep -c -- 'memory: "20Gi"' /tmp/pd-cell.yaml)" -ge 4

      - name: Verify generic KVTransferConfig and Mooncake rendering
        shell: bash
        run: |
          set -euo pipefail

          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            --set-string pdCellSpec.kvTransfer.config.kv_load_failure_policy=recompute \
            --set-string 'pdCellSpec.kvTransfer.config.kv_connector_extra_config.backends[0]=UCX' \
            > /tmp/pd-nixl-config.yaml

          grep -Fq -- 'kv_load_failure_policy' /tmp/pd-nixl-config.yaml
          grep -Fq -- 'recompute' /tmp/pd-nixl-config.yaml
          grep -Fq -- 'backends' /tmp/pd-nixl-config.yaml
          grep -Fq -- 'UCX' /tmp/pd-nixl-config.yaml

          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            --set-string 'pdCellSpec.models[0].prefill.internalPortMode=dp' \
            --set-string 'pdCellSpec.models[0].decode.internalPortMode=dp' \
            > /tmp/pd-dp-ports.yaml

          grep -Fq -- 'name: VLLM_DP_MASTER_PORT' /tmp/pd-dp-ports.yaml
          if grep -Fq -- 'name: VLLM_PORT' /tmp/pd-dp-ports.yaml; then
            echo 'VLLM_PORT must not be forced when internalPortMode=dp'
            exit 1
          fi

          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            --set-string pdCellSpec.kvTransfer.connector=MooncakeConnector \
            --set-string pdCellSpec.kvTransfer.config.kv_connector_extra_config.mooncake_protocol=tcp \
            --set pdCellSpec.kvTransfer.config.kv_connector_extra_config.num_workers=16 \
            > /tmp/pd-mooncake.yaml

          grep -Fq -- 'MooncakeConnector' /tmp/pd-mooncake.yaml
          grep -Fq -- 'mooncake_protocol' /tmp/pd-mooncake.yaml
          grep -Fq -- 'name: VLLM_MOONCAKE_BOOTSTRAP_PORT' /tmp/pd-mooncake.yaml
          grep -Fq -- 'name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT' /tmp/pd-mooncake.yaml

      - name: Verify vLLM Router CLI and asymmetric GPU example
        shell: bash
        run: |
          set -euo pipefail

          helm template pd-test ./helm -n inference \
            -f helm/examples/pd-cell-values-full.yaml \
            --set-string pdCellSpec.router.type=vllm \
            --set-string pdCellSpec.router.repository=registry.example/vllm-router \
            > /tmp/pd-vllm-router.yaml

          grep -Fq -- '--vllm-pd-disaggregation' /tmp/pd-vllm-router.yaml
          grep -Fq -- '--prefill' /tmp/pd-vllm-router.yaml
          grep -Fq -- '--decode' /tmp/pd-vllm-router.yaml
          grep -Fq -- '--kv-connector' /tmp/pd-vllm-router.yaml
          grep -Fq -- 'nvidia.com/gpu: "4"' /tmp/pd-vllm-router.yaml
          grep -Fq -- 'nvidia.com/gpu: "2"' /tmp/pd-vllm-router.yaml

      - name: Upload rendered manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pd-cell-rendered-manifest
          path: /tmp/pd-cell.yaml
