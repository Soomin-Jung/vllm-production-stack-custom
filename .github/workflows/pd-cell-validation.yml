name: Validate P-D Cell Helm extension

on:
  pull_request:
    paths:
      - 'helm/templates/_helpers.tpl'
      - 'helm/templates/configmap-pd-cell-gpu-launcher.yaml'
      - 'helm/templates/deployment-pd-cell.yaml'
      - 'helm/templates/service-pd-cell.yaml'
      - 'helm/examples/pd-cell-values.yaml'
      - 'helm/examples/pd-cell-values-full.yaml'
      - 'helm/tests/pdCell_test.yaml'
      - 'helm/docs/PD_CELL_0.1.8_KO.md'
      - 'helm/docs/PD_CELL_VALUES_REFERENCE_KO.md'
      - 'helm/docs/VLLM_ROUTER_IMAGE_BUILD_KO.md'
      - 'docker/vllm-router/**'
      - '.github/workflows/pd-cell-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pd-cell-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for Router packaging validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Validate closed-network Router packaging contract
        shell: bash
        run: |
          set -euo pipefail

          # Production primary: standalone Rust binary through internal proxies.
          grep -Fq -- 'RUST_BUILDER_IMAGE=rustlang/rust:nightly-bullseye' \
            docker/vllm-router/Dockerfile.rust-proxy
          grep -Fq -- 'RUNTIME_IMAGE=python:3.12-slim-bullseye' \
            docker/vllm-router/Dockerfile.rust-proxy
          grep -Fq -- 'COPY ./sources.list /etc/apt/sources.list' \
            docker/vllm-router/Dockerfile.rust-proxy
          grep -Fq -- 'COPY ./cargo-config.toml /usr/local/cargo/config.toml' \
            docker/vllm-router/Dockerfile.rust-proxy
          grep -Fq -- 'cargo build --release --locked' \
            docker/vllm-router/Dockerfile.rust-proxy
          grep -Fq -- 'ldd /usr/local/bin/vllm-router' \
            docker/vllm-router/Dockerfile.rust-proxy
          grep -Fq -- 'vllm-router --help' \
            docker/vllm-router/Dockerfile.rust-proxy

          if grep -Eq '(^|[[:space:]])pip(3)?[[:space:]]+install' \
              docker/vllm-router/Dockerfile.rust-proxy; then
            echo 'Production Rust Router image must not depend on pip/PyPI'
            exit 1
          fi

          python - <<'PY'
          import tomllib
          from pathlib import Path

          path = Path('docker/vllm-router/cargo-config.toml.example')
          with path.open('rb') as fh:
              cfg = tomllib.load(fh)

          assert cfg['registry']['default'] == 'cargo-proxy'

          index = cfg['registries']['cargo-proxy']['index']
          replacement = cfg['source']['cargo-proxy']['registry']
          assert index.startswith(('sparse+http://', 'sparse+https://'))
          assert index.endswith('/')
          assert replacement == index
          assert cfg['source']['crates-io']['replace-with'] == 'cargo-proxy'
          PY

          grep -Fq -- 'Proxy 연결 URL: index.crates.io' \
            docker/vllm-router/cargo-config.toml.example
          grep -Fq -- 'doc.rust-lang.org/cargo/reference/config.html' \
            docker/vllm-router/cargo-config.toml.example

          # Wheel path is retained as fallback/release-artifact cross-check.
          bash -n docker/vllm-router/prepare-wheelhouse.sh
          grep -Fq -- '--no-index' docker/vllm-router/Dockerfile
          grep -Fq -- '--find-links=/opt/vllm-router-wheelhouse' docker/vllm-router/Dockerfile
          grep -Fq -- '--only-binary=:all:' docker/vllm-router/Dockerfile
          grep -Fq -- 'sha256sum -c SHA256SUMS' docker/vllm-router/Dockerfile
          grep -Fq -- 'vllm-router --help' docker/vllm-router/Dockerfile
          grep -Fq -- '--only-binary=:all:' docker/vllm-router/Dockerfile.proxy
          grep -Fq -- 'update-ca-certificates' docker/vllm-router/Dockerfile.proxy
          grep -Fq -- 'vllm-router --help' docker/vllm-router/Dockerfile.proxy
          grep -Fq -- '2f268b001a546d7921c2e87b510869134a212f0ab2faf138b78eb554c93a2241' \
            docker/vllm-router/prepare-wheelhouse.sh
          grep -Fq -- 'c30070b2f8559fc33da4b114e58d28881775585dd6f6e1ac173ea494c8fbe20e' \
            docker/vllm-router/prepare-wheelhouse.sh

          if grep -Eq '^# syntax=' docker/vllm-router/Dockerfile \
              docker/vllm-router/Dockerfile.proxy \
              docker/vllm-router/Dockerfile.rust-proxy; then
            echo 'Closed-network Router Dockerfiles must not require an external BuildKit frontend'
            exit 1
          fi

      - name: Build and execute vLLM Router release-wheel fallback image
        shell: bash
        run: |
          set -euo pipefail

          bash docker/vllm-router/prepare-wheelhouse.sh 0.1.15
          rm -f docker/vllm-router/vllm-router-0.1.15-wheelhouse.tar.gz

          docker build \
            -f docker/vllm-router/Dockerfile \
            --build-arg BASE_IMAGE=python:3.12-slim-bookworm \
            --build-arg VLLM_ROUTER_VERSION=0.1.15 \
            -t pd-cell-vllm-router:v0.1.15 \
            docker/vllm-router

          docker run --rm pd-cell-vllm-router:v0.1.15 \
            vllm-router --help > /tmp/vllm-router-help.txt

          grep -Fq -- '--vllm-pd-disaggregation' /tmp/vllm-router-help.txt
          grep -Fq -- '--kv-connector' /tmp/vllm-router-help.txt
          grep -Fq -- 'nixl' /tmp/vllm-router-help.txt
          grep -Fq -- 'mooncake' /tmp/vllm-router-help.txt
          grep -Fq -- 'moriio' /tmp/vllm-router-help.txt

      - name: Helm lint examples
        shell: bash
        run: |
          set -euo pipefail
          helm lint ./helm \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml
          helm lint ./helm \
            -f helm/examples/pd-cell-values-full.yaml

      - name: Render Mooncake P-D Cell baseline
        shell: bash
        run: |
          set -euo pipefail
          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            > /tmp/pd-cell.yaml

      - name: Verify fixed vLLM Router orchestration contract
        shell: bash
        run: |
          set -euo pipefail

          contains() {
            local needle="$1"
            grep -Fq -- "$needle" /tmp/pd-cell.yaml || {
              echo "Missing rendered P/D invariant: $needle"
              exit 1
            }
          }

          absent() {
            local needle="$1"
            if grep -Fq -- "$needle" /tmp/pd-cell.yaml; then
              echo "Legacy/forbidden P/D invariant still rendered: $needle"
              exit 1
            fi
          }

          contains 'kind: Deployment'
          contains 'pd-test-example-pd-p1d1-pd-cell'
          contains 'pd-orchestrator: "vllm-router"'
          contains 'pd-kv-connector: "mooncake"'
          contains 'name: gpu-reservation'
          contains 'name: pd-router'
          contains '- "vllm-router"'
          contains 'name: NVIDIA_VISIBLE_DEVICES'
          contains 'name: CNTR_GPU_IDX'
          contains 'value: "0,1,2,3"'
          contains 'value: "4,5,6,7"'
          contains '/opt/pd-cell-gpu/launch-vllm.sh'
          contains 'pd-mooncake-gpu-map'
          contains 'pd-mooncake-gpu-launcher'
          contains '--vllm-pd-disaggregation'
          contains '--kv-connector'
          contains 'mooncake'
          contains '--prefill'
          contains 'http://127.0.0.1:8101'
          contains '"9001"'
          contains '--decode'
          contains 'http://127.0.0.1:8201'
          contains '--health-check-interval-secs'
          contains '--health-check-timeout-secs'
          contains '--prometheus-port'
          contains 'containerPort: 29000'
          contains 'MooncakeConnector'
          contains 'kv_producer'
          contains 'kv_consumer'
          contains 'name: VLLM_MOONCAKE_BOOTSTRAP_PORT'
          contains 'name: VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT'
          contains 'nvlink_intra'
          absent '--served-model-name'
          contains 'imagePullPolicy: "IfNotPresent"'
          contains 'name: PROMETHEUS_MULTIPROC_DIR'
          contains 'value: /tmp'
          contains 'targetPort: pd-router'

          # The reservation sidecar is the only Mooncake container that owns
          # Kubernetes GPU extended resources. It has requests + limits, so the
          # exact resource key must appear twice in the rendered baseline.
          gpu_resource_count="$(grep -Fc -- 'nvidia.com/gpu: "8"' /tmp/pd-cell.yaml || true)"
          if [[ "${gpu_resource_count}" != "2" ]]; then
            echo "Expected exactly two reservation GPU resource lines, got ${gpu_resource_count}"
            exit 1
          fi

          absent 'hostIPC:'
          absent 'shareProcessNamespace:'
          absent 'disaggregated_prefill_orchestrated'
          absent '--static-backends'
          absent '--static-models'
          absent '--static-aliases'

      - name: Verify NIXL mapping still uses vLLM Router
        shell: bash
        run: |
          set -euo pipefail
          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            --set-string 'pdCellSpec.models[0].kvTransfer.connector=NixlConnector' \
            --set-string 'pdCellSpec.models[0].kvTransfer.config.kv_connector_extra_config.backends[0]=UCX' \
            > /tmp/pd-nixl.yaml

          grep -Fq -- 'pd-orchestrator: "vllm-router"' /tmp/pd-nixl.yaml
          grep -Fq -- 'pd-kv-connector: "nixl"' /tmp/pd-nixl.yaml
          grep -Fq -- '--vllm-pd-disaggregation' /tmp/pd-nixl.yaml
          grep -Fq -- 'NixlConnector' /tmp/pd-nixl.yaml
          grep -Fq -- 'name: VLLM_NIXL_SIDE_CHANNEL_PORT' /tmp/pd-nixl.yaml

          # NIXL remains on the legacy per-engine GPU allocation path. The
          # Mooncake GPU reservation wrapper must not leak into this render.
          if grep -Fq -- 'name: gpu-reservation' /tmp/pd-nixl.yaml; then
            echo 'NIXL render must not contain Mooncake gpu-reservation'
            exit 1
          fi
          if grep -Fq -- 'pd-mooncake-gpu-launcher' /tmp/pd-nixl.yaml; then
            echo 'NIXL render must not contain Mooncake GPU launcher'
            exit 1
          fi
          if grep -Fq -- 'name: NVIDIA_VISIBLE_DEVICES' /tmp/pd-nixl.yaml; then
            echo 'NIXL render must keep its existing device-plugin visibility contract'
            exit 1
          fi

          # P1D1 minimal example: per-engine GPU resources remain 4 + 4, each
          # rendered under requests and limits.
          nixl_gpu_resource_count="$(grep -Fc -- 'nvidia.com/gpu: "4"' /tmp/pd-nixl.yaml || true)"
          if [[ "${nixl_gpu_resource_count}" != "4" ]]; then
            echo "Expected four NIXL per-engine GPU resource lines, got ${nixl_gpu_resource_count}"
            exit 1
          fi

      - name: Verify Mooncake protocol and device IDs are chart-owned
        shell: bash
        run: |
          set -euo pipefail

          if helm template pd-test ./helm -n inference               -f global-values.yaml               -f helm/examples/pd-cell-values.yaml               --set-string 'pdCellSpec.models[0].kvTransfer.config.kv_connector_extra_config.mooncake_protocol=rdma'               > /tmp/pd-forbidden-protocol.yaml 2>/tmp/pd-forbidden-protocol.err; then
            echo 'Mooncake protocol override must be rejected'
            exit 1
          fi
          grep -Fq -- 'mooncake_protocol is chart-managed' /tmp/pd-forbidden-protocol.err

          if helm template pd-test ./helm -n inference               -f global-values.yaml               -f helm/examples/pd-cell-values.yaml               --set-string 'pdCellSpec.models[0].prefill.extraArgs[0]=--device-ids=0,1,2,3'               > /tmp/pd-forbidden-device-ids.yaml 2>/tmp/pd-forbidden-device-ids.err; then
            echo 'Mooncake --device-ids override must be rejected'
            exit 1
          fi
          grep -Fq -- 'device-ids is chart-managed' /tmp/pd-forbidden-device-ids.err

      - name: Verify API-key propagation to Cell router
        shell: bash
        run: |
          set -euo pipefail
          helm template pd-test ./helm -n inference \
            -f global-values.yaml \
            -f helm/examples/pd-cell-values.yaml \
            --set-string servingEngineSpec.vllmApiKey=test-api-key \
            > /tmp/pd-auth.yaml

          grep -Fq -- 'name: OPENAI_API_KEY' /tmp/pd-auth.yaml
          grep -Fq -- 'name: VLLM_API_KEY' /tmp/pd-auth.yaml

      - name: Verify legacy Cell router selector is rejected
        shell: bash
        run: |
          set -euo pipefail
          if helm template pd-test ./helm -n inference \
              -f global-values.yaml \
              -f helm/examples/pd-cell-values.yaml \
              --set-string pdCellSpec.router.type=lmstack \
              > /tmp/pd-legacy.yaml 2>/tmp/pd-legacy.err; then
            echo 'router.type=lmstack must not be accepted inside P/D Cell'
            exit 1
          fi
          grep -Fq -- 'router.type was removed' /tmp/pd-legacy.err

      - name: Run P-D Cell helm-unittest suite
        shell: bash
        run: |
          set -euo pipefail
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 0.8.2
          helm unittest ./helm -f 'tests/pdCell_test.yaml'

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pd-cell-rendered-manifests
          path: |
            /tmp/pd-cell.yaml
            /tmp/pd-nixl.yaml
            /tmp/pd-auth.yaml
