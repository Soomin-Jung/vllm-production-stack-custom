name: jev-decide-mcp-ci

on:
  pull_request:
    paths:
      - 'integrations/jev-decide-mcp/**'
      - '.github/workflows/jev-decide-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/jev-decide-mcp/**'
      - '.github/workflows/jev-decide-mcp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: integrations/jev-decide-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest checks
      - run: python -m build
