name: Apply reviewed baseline feedback staging

on:
  push:
    branches:
      - agent/baseline-review-feedback-staging
    paths:
      - scripts/apply-reviewed-baseline-feedback-v2.py
      - .github/workflows/apply-reviewed-baseline-feedback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/baseline-review-feedback-staging

      - name: Apply reviewed feedback
        run: python3 scripts/apply-reviewed-baseline-feedback-v2.py

      - name: Commit reviewed source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            helm/values.yaml \
            helm/templates/deployment-router.yaml \
            helm/templates/deployment-vllm-multi.yaml \
            helm/templates/ray-cluster.yaml
          git diff --cached --check
          git commit -m "fix: align reviewed production baseline"
          git push origin HEAD:agent/baseline-review-feedback-staging
