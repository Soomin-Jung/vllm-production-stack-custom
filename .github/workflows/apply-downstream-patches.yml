name: Finalize downstream baseline

on:
  push:
    branches:
      - agent/production-0.1.8-custom-baseline
    paths:
      - scripts/finalize-deployment-vllm.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize non-Ray vLLM template
        run: python3 scripts/finalize-deployment-vllm.py

      - name: Commit finalized template
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- helm/; then
            echo "Template already finalized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/templates/deployment-vllm-multi.yaml
          git commit -m "feat: externalize vLLM runtime configuration"
          git push
