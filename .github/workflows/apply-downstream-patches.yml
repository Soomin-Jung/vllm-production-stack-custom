name: Apply downstream baseline

on:
  push:
    branches:
      - agent/production-0.1.8-custom-baseline
    paths:
      - scripts/apply-production-baseline.py
      - scripts/run-production-baseline.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated baseline rewrites
        run: python3 scripts/run-production-baseline.py

      - name: Commit rendered baseline
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- helm/; then
            echo "Baseline already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/
          git commit -m "chore: apply production 0.1.8 baseline"
          git push
