[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-decide-mcp"
version = "0.1.0"
description = "MCP bridge to a self-hosted AutoTrust JEV /v1/decide endpoint"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
    "black>=25.1,<26",
    "isort>=6,<7",
    "build>=1,<2",
]

[project.scripts]
jev-decide-mcp = "jev_decide_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_decide_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["checks"]
python_files = ["*_cases.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["contract_cases", "jev_decide_mcp"]

[tool.isort]
profile = "black"
known_first_party = ["contract_cases", "jev_decide_mcp"]
